/* Generated by `npm run build:gas` from the project files. Edit those, not this one. */

/* ── config.js ── */
/*
 * The Redeemer's Challenge — settings for the GitHub Pages version.
 *
 * apiUrl: leave empty to play locally (the default). To use the optional shared
 *   leaderboard, paste your Apps Script web app URL here — it ends in /exec.
 *   See README.md → "Optional: shared leaderboard". The Apps Script version
 *   ignores this setting and talks to its own back end directly.
 * timerSeconds: default seconds per question: 0 (off), 10, 15, 20 or 30.
 *   Players can change it in Settings.
 */
window.REDEEMER_CONFIG = {
  apiUrl: '',
  timerSeconds: 15,
};


/* ── shared/util.js ── */
/*
 * Small browser helpers shared by the hub, the games and the admin dashboard.
 */
(function (root) {
  'use strict';

  const U = {};

  U.$ = (id) => document.getElementById(id);

  U.el = function (tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  /** A button with optional class, text and click handler. */
  U.button = function (text, cls, onClick) {
    const btn = U.el('button', cls || 'btn btn-ghost', text);
    btn.type = 'button';
    if (onClick) btn.addEventListener('click', onClick);
    return btn;
  };

  U.svg = function (id, cls) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('aria-hidden', 'true');
    if (cls) svg.setAttribute('class', cls);
    const use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#' + id);
    svg.appendChild(use);
    return svg;
  };

  // Browser storage is optional: private windows and sandboxed frames may block it.
  U.store = {
    get(area, key, fallback) {
      try {
        const raw = root[area].getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    },
    set(area, key, value) {
      try {
        root[area].setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        return false;
      }
    },
    remove(area, key) {
      try { root[area].removeItem(key); } catch (e) { /* not available */ }
    },
  };

  U.uuid = function () {
    if (root.crypto && root.crypto.randomUUID) return root.crypto.randomUUID();
    const bytes = new Uint8Array(16);
    if (root.crypto && root.crypto.getRandomValues) root.crypto.getRandomValues(bytes);
    else for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
    return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('').replace(/^(.{8})(.{4})(.{4})(.{4})/, '$1-$2-$3-$4-');
  };

  /** Shares the device id with The Redeemer's Challenge so one phone is one player. */
  U.deviceId = (function () {
    let cached = null;
    return function () {
      if (cached) return cached;
      let id = U.store.get('localStorage', 'redeemer.device.v1', null);
      if (typeof id !== 'string' || !/^[A-Za-z0-9-]{16,64}$/.test(id)) {
        id = U.uuid();
        U.store.set('localStorage', 'redeemer.device.v1', id);
      }
      cached = id;
      return id;
    };
  })();

  U.clamp = (v, min, max) => Math.min(max, Math.max(min, v));

  U.plural = (n, word, many) => n + ' ' + (n === 1 ? word : many || word + 's');

  U.formatClock = function (ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ':' + String(s).padStart(2, '0');
  };

  U.formatSeconds = function (ms) {
    return (Math.max(0, ms) / 1000).toFixed(1) + 's';
  };

  /** A short buzz on phones that support it, only after the player has interacted. */
  U.vibrate = function (ms) {
    const nav = root.navigator;
    if (!nav || !nav.vibrate || !(nav.userActivation && nav.userActivation.hasBeenActive)) return;
    try { nav.vibrate(ms); } catch (e) { /* not allowed */ }
  };

  U.reducedMotion = function () {
    return !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
  };

  let toastTimer = null;
  U.toast = function (message, ms) {
    const el = U.$('toast');
    if (!el) return;
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, ms || 3200);
  };

  /** Plain-text CSV. Cells starting with = + - @ are prefixed so spreadsheets don't run them. */
  U.toCsv = function (rows) {
    return rows
      .map((row) =>
        row
          .map((cell) => {
            let text = cell == null ? '' : String(cell);
            if (/^[=+\-@]/.test(text)) text = "'" + text;
            return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
          })
          .join(',')
      )
      .join('\r\n');
  };

  /** Animated "3, 2, 1, Go!" in the given element. Resolves when finished. */
  U.countdown = function (el, sfx) {
    return new Promise((resolve) => {
      const steps = ['3', '2', '1', 'Go!'];
      let i = 0;
      el.hidden = false;
      function tick() {
        if (i >= steps.length) {
          el.hidden = true;
          el.textContent = '';
          resolve();
          return;
        }
        el.textContent = steps[i];
        el.classList.remove('pop');
        void el.offsetWidth; // restart the animation
        el.classList.add('pop');
        if (sfx) sfx.play(i < 3 ? 'count' : 'go');
        i += 1;
        setTimeout(tick, i === steps.length ? 450 : 750);
      }
      tick();
    });
  };

  root.HubUtil = U;
})(window);


/* ── shared/rng.js ── */
/*
 * Seeded random numbers. The same seed always produces the same sequence on every
 * device (and on the Apps Script server), which is what makes the arcade and puzzle
 * games fair: everyone in a session faces the same falling objects and the same levels.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.HubRng = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const SEED_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I

  /** A 32-bit hash of a string (MurmurHash3-style finaliser). */
  function hashString(text) {
    const str = String(text);
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }

  /** mulberry32: small, fast and good enough for games. */
  function create(seed) {
    let state = typeof seed === 'number' ? seed >>> 0 : hashString(seed);
    function next() {
      state = (state + 0x6d2b79f5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    return {
      next,
      /** Integer in [min, max], inclusive. */
      int(min, max) {
        return min + Math.floor(next() * (max - min + 1));
      },
      range(min, max) {
        return min + next() * (max - min);
      },
      chance(p) {
        return next() < p;
      },
      pick(list) {
        return list[Math.floor(next() * list.length)];
      },
      shuffle(list) {
        const out = list.slice();
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          const tmp = out[i];
          out[i] = out[j];
          out[j] = tmp;
        }
        return out;
      },
    };
  }

  /** A fresh, human-friendly seed such as "K7QM2A". */
  function newSeed(random) {
    const rand = random || Math.random;
    let out = '';
    for (let i = 0; i < 6; i++) out += SEED_ALPHABET.charAt(Math.floor(rand() * SEED_ALPHABET.length));
    return out;
  }

  /** Seeds are 3–16 letters, numbers or dashes. Returns '' if invalid. */
  function normalizeSeed(raw) {
    const s = String(raw == null ? '' : raw).toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 16);
    return s.length >= 3 ? s : '';
  }

  return { hashString, create, newSeed, normalizeSeed, SEED_ALPHABET };
});


/* ── shared/prefs.js ── */
/*
 * Per-device preferences shared by every game: sound, theme, nickname and team.
 * Sound is off by default.
 */
(function (root) {
  'use strict';

  const KEY = 'hub.prefs.v1';
  const store = root.HubUtil.store;
  const listeners = [];

  const prefs = Object.assign({ sound: false, theme: 'auto', nickname: '', team: '' }, store.get('localStorage', KEY, {}));
  if (['auto', 'light', 'dark'].indexOf(prefs.theme) < 0) prefs.theme = 'auto';
  prefs.sound = prefs.sound === true;

  function applyTheme() {
    if (prefs.theme === 'light' || prefs.theme === 'dark') document.documentElement.setAttribute('data-theme', prefs.theme);
    else document.documentElement.removeAttribute('data-theme');
  }

  root.HubPrefs = {
    get: () => Object.assign({}, prefs),
    sound: () => prefs.sound,
    set(patch) {
      Object.assign(prefs, patch);
      store.set('localStorage', KEY, prefs);
      if ('theme' in patch) applyTheme();
      listeners.forEach((fn) => fn(Object.assign({}, prefs)));
    },
    onChange(fn) {
      listeners.push(fn);
    },
    applyTheme,
  };

  applyTheme();
})(window);


/* ── shared/sfx.js ── */
/*
 * Sound effects made with Web Audio (no audio files). Silent unless the player has
 * turned sound on.
 */
(function (root) {
  'use strict';

  let ctx = null;

  function ready() {
    if (!root.HubPrefs || !root.HubPrefs.sound()) return null;
    try {
      if (!ctx) {
        const AC = root.AudioContext || root.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) {
      return null;
    }
  }

  function tone(freq, at, dur, type, peak, slideTo) {
    const c = ready();
    if (!c) return;
    const t0 = c.currentTime + at;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak || 0.07, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  const SOUNDS = {
    catch: () => tone(660, 0, 0.09, 'triangle', 0.05, 880),
    golden: () => { tone(784, 0, 0.1, 'triangle', 0.06); tone(1175, 0.07, 0.18, 'triangle', 0.06); },
    hazard: () => tone(180, 0, 0.3, 'sawtooth', 0.05, 90),
    power: () => { tone(520, 0, 0.12, 'sine', 0.06, 1040); tone(1040, 0.1, 0.15, 'sine', 0.04); },
    miss: () => tone(300, 0, 0.12, 'sine', 0.03, 220),
    count: () => tone(523, 0, 0.12, 'square', 0.03),
    go: () => tone(784, 0, 0.25, 'square', 0.04),
    tick: () => tone(880, 0, 0.05, 'square', 0.02),
    rotate: () => tone(420, 0, 0.05, 'triangle', 0.035, 520),
    locked: () => tone(160, 0, 0.12, 'square', 0.03),
    solve: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.25, 'triangle', 0.05)),
    buzz: () => tone(220, 0, 0.35, 'sawtooth', 0.06, 200),
    correct: () => { tone(523, 0, 0.16, 'triangle', 0.06); tone(784, 0.1, 0.3, 'triangle', 0.06); },
    wrong: () => { tone(233, 0, 0.24, 'sine', 0.06); tone(185, 0.12, 0.32, 'sine', 0.05); },
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.1, 0.4, 'triangle', 0.05)),
    end: () => { tone(392, 0, 0.2, 'sine', 0.06); tone(294, 0.16, 0.4, 'sine', 0.06); },
  };

  root.HubSfx = {
    unlock: ready,
    play(name) {
      const fn = SOUNDS[name];
      if (fn) fn();
    },
  };
})(window);


/* ── shared/loop.js ── */
/*
 * Fixed-timestep game loop on requestAnimationFrame. The simulation always advances in
 * equal steps, so a game plays at the same speed on a fast laptop and a slow phone.
 */
(function (root) {
  'use strict';

  /**
   * opts.step(dt)   advance the simulation by dt seconds (called 0+ times per frame)
   * opts.render()   draw the current state (called once per frame)
   * opts.fixedDt    simulation step in seconds (default 1/120)
   */
  function create(opts) {
    const fixedDt = opts.fixedDt || 1 / 120;
    const maxFrame = 0.1; // after a stall, don't try to catch up more than this
    let raf = null;
    let last = 0;
    let acc = 0;
    let running = false;

    function frame(now) {
      if (!running) return;
      let dt = (now - last) / 1000;
      last = now;
      if (dt > maxFrame) dt = maxFrame;
      if (dt < 0) dt = 0;
      acc += dt;
      while (acc >= fixedDt) {
        opts.step(fixedDt);
        acc -= fixedDt;
        if (!running) return;
      }
      opts.render();
      raf = root.requestAnimationFrame(frame);
    }

    return {
      start() {
        if (running) return;
        running = true;
        acc = 0;
        last = root.performance.now();
        raf = root.requestAnimationFrame(frame);
      },
      stop() {
        running = false;
        if (raf !== null) root.cancelAnimationFrame(raf);
        raf = null;
      },
      get running() { return running; },
    };
  }

  root.HubLoop = { create };
})(window);


/* ── shared/confetti.js ── */
/*
 * Celebration confetti on the shared #confetti canvas. Skipped for reduced motion.
 */
(function (root) {
  'use strict';

  let run = 0;

  function burst(opts) {
    if (root.HubUtil.reducedMotion()) return;
    const canvas = document.getElementById('confetti');
    const ctx = canvas && canvas.getContext && canvas.getContext('2d');
    if (!ctx) return;
    const id = ++run;
    const dpr = Math.min(root.devicePixelRatio || 1, 2);
    const w = root.innerWidth;
    const h = root.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const css = getComputedStyle(document.documentElement);
    const colors = ['--gold', '--olive', '--clay', '--gold-soft', '--accent'].map((v) => css.getPropertyValue(v).trim() || '#b88a2c');
    const count = Math.min((opts && opts.count) || 150, Math.round(w / 5));
    const pieces = Array.from({ length: count }, (_, i) => ({
      x: Math.random() * w,
      y: -20 - Math.random() * h * 0.6,
      vx: (Math.random() - 0.5) * 2.4,
      vy: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.2,
      size: 6 + Math.random() * 6,
      color: colors[i % colors.length],
    }));
    const started = root.performance.now();
    function frame(now) {
      if (id !== run) return;
      ctx.clearRect(0, 0, w, h);
      let alive = false;
      for (const p of pieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035;
        p.rot += p.vr;
        if (p.y < h + 20) alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4 * Math.abs(Math.cos(p.rot)) + 1);
        ctx.restore();
      }
      if (alive && now - started < 5000) root.requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    }
    root.requestAnimationFrame(frame);
  }

  root.HubConfetti = { burst };
})(window);


/* ── shared/leaderboard.js ── */
/*
 * Animated leaderboard lists. Rows slide to their new positions when ranks change
 * (FLIP technique), and rows that moved up flash briefly.
 *
 * rows: [{ key, rank, name, detail, score, you }]
 */
(function (root) {
  'use strict';

  const U = root.HubUtil;

  function render(list, rows, opts) {
    opts = opts || {};
    const before = new Map();
    const oldRanks = new Map();
    Array.from(list.children).forEach((li) => {
      if (li.dataset.key) {
        before.set(li.dataset.key, li.getBoundingClientRect().top);
        oldRanks.set(li.dataset.key, Number(li.dataset.rank));
      }
    });

    list.textContent = '';
    if (!rows.length) {
      list.appendChild(U.el('li', 'leaderboard-empty', opts.empty || 'No scores yet.'));
      return;
    }

    const limit = opts.limit || rows.length;
    rows.slice(0, limit).forEach((row) => {
      const li = U.el('li', row.you ? 'is-you' : '');
      li.dataset.key = row.key;
      li.dataset.rank = String(row.rank);
      const who = U.el('span', 'who', row.name);
      if (row.detail) who.appendChild(U.el('small', null, row.detail));
      li.append(U.el('span', 'rank', String(row.rank)), who, U.el('span', 'pts', String(row.score)));
      list.appendChild(li);
    });

    if (U.reducedMotion()) return;
    Array.from(list.children).forEach((li) => {
      const key = li.dataset.key;
      if (!key) return;
      const prevTop = before.get(key);
      const now = li.getBoundingClientRect().top;
      if (prevTop === undefined) {
        li.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'ease-out' });
        return;
      }
      const dy = prevTop - now;
      if (dy) li.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });
      const was = oldRanks.get(key);
      if (was && Number(li.dataset.rank) < was) li.classList.add('rank-up');
    });
  }

  root.HubBoard = { render };
})(window);

  function hint(lvl) {
    for (let i = 0; i < lvl.tiles.length; i++) {
      const t = lvl.tiles[i];
      if (t.path && !t.locked && !covers(rotate(t.base, t.rot), t.need)) {
        t.rot = (t.rot + tapsNeeded(t.base, t.rot, t.need)) % 4;
        t.locked = true;
        t.hinted = true;
        return [Math.floor(i / lvl.size), i % lvl.size];
      }
    }
    return null;
  }

  /** Points for one cleared level. */
  function levelScore(stat, size, minRot, s) {
    const cells = size * size;
    const base = Math.round((s.pointsPerLevel * cells) / 16);
    const target = s.targetSecPerTile * cells * 1000;
    const timeBonus = stat.ms < target ? Math.round((s.timeBonusMax * (target - stat.ms)) / target) : 0;
    const extra = Math.max(0, stat.rotations - minRot);
    const efficiency = Math.max(0, s.efficiencyMax - extra * 3);
    const hintPenalty = (stat.hints || 0) * s.hintCost;
    return { base, timeBonus, efficiency, hintPenalty, total: Math.max(0, base + timeBonus + efficiency - hintPenalty) };
  }

  function tiebreakSettings(s) {
    return Object.assign({}, s, { locked: false, checkpoints: false });
  }

  /**
   * Server-side check and re-scoring of a submitted run.
   * result: { levels: [{ level, ms, rotations, hints }], totalMs }
   * Returns { ok, score, levelsCleared, totalMs } or { ok: false, reason }.
   */
  function scoreRun(result, s, seed) {
    if (!result || !Array.isArray(result.levels)) return { ok: false, reason: 'Missing levels.' };
    const levels = result.levels;
    if (levels.length > s.levelsPerRound) return { ok: false, reason: 'Too many levels.' };
    let score = 0;
    let total = 0;
    for (let i = 0; i < levels.length; i++) {
      const L = levels[i];
      if (!L || L.level !== i + 1) return { ok: false, reason: 'Levels out of order.' };
      if (![L.ms, L.rotations, L.hints].every((v) => Number.isInteger(v) && v >= 0)) return { ok: false, reason: 'Invalid level data.' };
      const lvl = generateLevel(seed, L.level, s);
      if (L.hints > lvl.pathLength) return { ok: false, reason: 'Too many hints.' };
      if (L.hints && !s.hintsAllowed) return { ok: false, reason: 'Hints are switched off.' };
      if (L.rotations + L.hints < 1) return { ok: false, reason: 'A level was cleared without a move.' };
      if (L.ms < MIN_MS_PER_LEVEL + L.rotations * MIN_MS_PER_ROTATION) return { ok: false, reason: 'A level was cleared impossibly fast.' };
      if (s.timerMode === 'perLevel' && L.ms > s.perLevelSec * 1000 + 1500) return { ok: false, reason: 'A level took longer than its clock.' };
      score += levelScore(L, lvl.size, lvl.minRotations, s).total;
      total += L.ms;
    }
    if (s.timerMode === 'total' && total > s.totalSec * 1000 + 1500) return { ok: false, reason: 'The run took longer than the round.' };
    return { ok: true, score, levelsCleared: levels.length, totalMs: total };
  }

  /** Server-side check of a sudden-death tie-breaker solve. */
  function checkTiebreak(result, s) {
    if (!result || !Number.isInteger(result.ms) || !Number.isInteger(result.rotations)) return { ok: false, reason: 'Invalid tie-breaker result.' };
    if (result.ms < MIN_MS_PER_LEVEL + result.rotations * MIN_MS_PER_ROTATION || result.rotations < 1) return { ok: false, reason: 'Impossibly fast.' };
    if (result.ms > 15 * 60 * 1000) return { ok: false, reason: 'Too slow to count.' };
    return { ok: true, ms: result.ms };
  }

  return {
    N,
    E,
    S,
    W,
    DIRS,
    DELTA,
    SHAPES,
    TIEBREAK_LEVEL,
    rotate,
    covers,
    sizeForLevel,
    features,
    generateLevel,
    maskAt,
    connected,
    isSolved,
    route,
    minRotations,
    tap,
    hint,
    levelScore,
    scoreRun,
    tiebreakSettings,
    checkTiebreak,
  };
});

/*

 * Rules and simulation live in rush-core.js; this file draws it and handles input.
 */
(function (root) {
  'use strict';

  const U = root.HubUtil;

  const KEY_SPEED = 1.5; // basket speed with the keyboard, field widths per second

  // ───────────── Sprites (drawn once per size, then reused every frame) ─────────────

  function sprite(size, draw, halo) {
    const c = document.createElement('canvas');
    c.width = c.height = Math.max(8, Math.round(size));
    const g = c.getContext('2d');
    if (halo) {
      // A soft dark outline keeps items readable against the golden field.
      g.shadowColor = 'rgba(45, 25, 8, 0.75)';
      g.shadowBlur = c.width * 0.07;
    }
    draw(g, c.width);
    return c;
  }

  function drawSheaf(g, s, golden) {
    if (golden) {
      g.save();
      g.shadowColor = 'transparent';
      const glow = g.createRadialGradient(s / 2, s / 2, s * 0.1, s / 2, s / 2, s * 0.5);
      glow.addColorStop(0, 'rgba(255, 226, 120, 0.85)');
      glow.addColorStop(1, 'rgba(255, 226, 120, 0)');
      g.fillStyle = glow;
      g.fillRect(0, 0, s, s);
      g.restore();
    }
    const stalk = golden ? '#e0a400' : '#b8892b';
    const head = golden ? '#ffd54a' : '#e2bb5c';
    const base = { x: s * 0.5, y: s * 0.94 };
    const tops = [-0.3, -0.15, 0, 0.15, 0.3];
    g.lineCap = 'round';
    tops.forEach((dx, i) => {
      const tx = s * (0.5 + dx);
      const ty = s * (0.2 + Math.abs(dx) * 0.35);
      g.strokeStyle = stalk;
      g.lineWidth = s * 0.05;
      g.beginPath();
      g.moveTo(base.x, base.y);
      g.quadraticCurveTo(s * (0.5 + dx * 0.3), s * 0.55, tx, ty);
      g.stroke();
      g.fillStyle = head;
      for (let k = 0; k < 3; k++) {
        const hy = ty + k * s * 0.07;
        g.beginPath();
        g.ellipse(tx - s * 0.035, hy, s * 0.03, s * 0.055, -0.5, 0, Math.PI * 2);
        g.ellipse(tx + s * 0.035, hy, s * 0.03, s * 0.055, 0.5, 0, Math.PI * 2);
        g.fill();
      }
      g.beginPath();
      g.ellipse(tx, ty - s * 0.05, s * 0.028, s * 0.06, 0, 0, Math.PI * 2);
      g.fill();
      if (i === 2 && golden) {
        g.fillStyle = '#fff6c8';
        g.beginPath();
        g.arc(tx + s * 0.12, ty - s * 0.06, s * 0.035, 0, Math.PI * 2);
        g.fill();
      }
    });
    g.fillStyle = golden ? '#9c5b12' : '#7a5230';
    g.fillRect(s * 0.4, s * 0.62, s * 0.2, s * 0.07);
  }

  function drawStone(g, s) {
    const pts = [1, 0.86, 0.95, 0.8, 0.92, 1, 0.85, 0.93];
    const grad = g.createRadialGradient(s * 0.4, s * 0.38, s * 0.05, s * 0.5, s * 0.5, s * 0.5);
    grad.addColorStop(0, '#b9b2a8');
    grad.addColorStop(1, '#615a52');
    g.fillStyle = grad;
    g.strokeStyle = '#3e3832';
    g.lineWidth = s * 0.04;
    g.beginPath();
    pts.forEach((r, i) => {
      const a = (i / pts.length) * Math.PI * 2;
      const x = s / 2 + Math.cos(a) * r * s * 0.42;
      const y = s / 2 + Math.sin(a) * r * s * 0.38;
      if (i === 0) g.moveTo(x, y);
      else g.lineTo(x, y);
    });
    g.closePath();
    g.fill();
    g.stroke();
    g.fillStyle = 'rgba(255,255,255,0.35)';
    g.beginPath();
    g.ellipse(s * 0.38, s * 0.36, s * 0.1, s * 0.05, -0.5, 0, Math.PI * 2);
    g.fill();
  }

  function drawThorn(g, s) {
    const c = s / 2;
    g.strokeStyle = '#4a2a1c';
    g.fillStyle = '#7d2f1d';
    g.lineWidth = s * 0.06;
    g.lineCap = 'round';
    for (let i = 0; i < 9; i++) {
      const a = (i / 9) * Math.PI * 2;
      const r1 = s * 0.18;
      const r2 = s * 0.46;
      g.beginPath();
      g.moveTo(c + Math.cos(a - 0.18) * r1, c + Math.sin(a - 0.18) * r1);
      g.lineTo(c + Math.cos(a) * r2, c + Math.sin(a) * r2);
      g.lineTo(c + Math.cos(a + 0.18) * r1, c + Math.sin(a + 0.18) * r1);
      g.closePath();
      g.fill();
    }
    g.beginPath();
    g.arc(c, c, s * 0.2, 0, Math.PI * 2);
    g.fillStyle = '#3d2417';
    g.fill();
    g.strokeStyle = '#6b3b22';
    g.lineWidth = s * 0.035;
    g.beginPath();
    g.arc(c, c, s * 0.12, 0.4, 4.5);
    g.stroke();
  }

  function drawPower(g, s, kind) {
    const c = s / 2;
    const colors = { wide: '#5f7a2a', slow: '#3f86a8', shield: '#b07d16' };
    g.fillStyle = 'rgba(255,255,255,0.55)';
    g.beginPath();
    g.arc(c, c, s * 0.48, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = colors[kind];
    g.beginPath();
    g.arc(c, c, s * 0.42, 0, Math.PI * 2);
    g.fill();
    g.strokeStyle = '#fff';
    g.fillStyle = '#fff';
    g.lineWidth = s * 0.07;
    g.lineCap = 'round';
    g.lineJoin = 'round';
    g.beginPath();
    if (kind === 'wide') {
      g.moveTo(s * 0.24, c);
      g.lineTo(s * 0.76, c);
      g.moveTo(s * 0.34, c - s * 0.1);
      g.lineTo(s * 0.24, c);
      g.lineTo(s * 0.34, c + s * 0.1);
      g.moveTo(s * 0.66, c - s * 0.1);
      g.lineTo(s * 0.76, c);
      g.lineTo(s * 0.66, c + s * 0.1);
    } else if (kind === 'slow') {
      g.moveTo(s * 0.24, s * 0.4);
      g.lineTo(s * 0.62, s * 0.4);
      g.arc(s * 0.62, s * 0.33, s * 0.07, Math.PI / 2, -Math.PI, true);
      g.moveTo(s * 0.24, s * 0.56);
      g.lineTo(s * 0.7, s * 0.56);
      g.arc(s * 0.7, s * 0.64, s * 0.08, -Math.PI / 2, Math.PI, false);
    } else {
      g.moveTo(c, s * 0.24);
      g.lineTo(s * 0.72, s * 0.32);
      g.quadraticCurveTo(s * 0.7, s * 0.66, c, s * 0.78);
      g.quadraticCurveTo(s * 0.3, s * 0.66, s * 0.28, s * 0.32);
      g.closePath();
    }
    g.stroke();
  }

  function drawBasket(g, cx, top, w, h, glow) {
    const bw = w * 0.82;
    if (glow) {
      g.save();
      g.shadowColor = glow;
      g.shadowBlur = 18;
    }
    const grad = g.createLinearGradient(0, top, 0, top + h);
    grad.addColorStop(0, '#a5733d');
    grad.addColorStop(1, '#6b4421');
    g.fillStyle = grad;
    g.beginPath();
    g.moveTo(cx - w / 2, top);
    g.lineTo(cx + w / 2, top);
    g.lineTo(cx + bw / 2, top + h);
    g.lineTo(cx - bw / 2, top + h);
    g.closePath();
    g.fill();
    if (glow) g.restore();
    g.strokeStyle = 'rgba(60, 35, 15, 0.55)';
    g.lineWidth = Math.max(1, h * 0.06);
    for (let i = 1; i < 4; i++) {
      const y = top + (h * i) / 4;
      const inset = ((w - bw) / 2) * (i / 4);
      g.beginPath();
      g.moveTo(cx - w / 2 + inset, y);
      g.lineTo(cx + w / 2 - inset, y);
      g.stroke();
    }
    for (let i = 1; i < 7; i++) {
      const fx = -0.5 + i / 7;
      g.beginPath();
      g.moveTo(cx + fx * w, top);
      g.lineTo(cx + fx * bw, top + h);
      g.stroke();
    }
    g.fillStyle = '#c99a5b';
    g.beginPath();
    g.ellipse(cx, top, w / 2 + 2, h * 0.16, 0, 0, Math.PI * 2);
    g.fill();
    g.fillStyle = 'rgba(70, 40, 15, 0.6)';
    g.beginPath();
    g.ellipse(cx, top, w / 2 - h * 0.12, h * 0.09, 0, 0, Math.PI * 2);
    g.fill();
  }

  function drawField(g, w, h) {
    const sky = g.createLinearGradient(0, 0, 0, h * 0.65);
    sky.addColorStop(0, '#f7e8c3');
    sky.addColorStop(1, '#f1cf86');
    g.fillStyle = sky;
    g.fillRect(0, 0, w, h);
    const sun = g.createRadialGradient(w * 0.78, h * 0.15, 4, w * 0.78, h * 0.15, w * 0.42);
    sun.addColorStop(0, 'rgba(255, 244, 205, 0.95)');
    sun.addColorStop(1, 'rgba(255, 244, 205, 0)');
    g.fillStyle = sun;
    g.fillRect(0, 0, w, h);
    function hills(baseY, amp, color, phase) {
      g.fillStyle = color;
      g.beginPath();
      g.moveTo(0, h);
      for (let i = 0; i <= 40; i++) {
        const x = (w * i) / 40;
        g.lineTo(x, baseY + Math.sin((x / w) * 5 + phase) * amp + Math.sin((x / w) * 11 + phase * 2) * amp * 0.3);
      }
      g.lineTo(w, h);
      g.closePath();
      g.fill();
    }
    hills(h * 0.5, h * 0.025, 'rgba(176, 160, 105, 0.7)', 1.3);
    hills(h * 0.57, h * 0.02, '#a3a35a', 0.2);
    const field = g.createLinearGradient(0, h * 0.62, 0, h);
    field.addColorStop(0, '#dcb45a');
    field.addColorStop(1, '#b8892f');
    g.fillStyle = field;
    g.fillRect(0, h * 0.62, w, h * 0.38);
    const rng = root.HubRng.create('field-art');
    g.lineCap = 'round';
    for (let i = 0; i < 140; i++) {
      const depth = rng.next();
      const y = h * (0.64 + depth * 0.36);
      const x = rng.next() * w;
      const len = h * (0.02 + depth * 0.05);
      g.strokeStyle = 'rgba(122, 86, 30,' + (0.25 + depth * 0.35) + ')';
      g.lineWidth = 1 + depth * 1.5;
      g.beginPath();
      g.moveTo(x, y);
      g.lineTo(x + len * 0.15, y - len);
      g.stroke();
      g.fillStyle = 'rgba(240, 205, 120,' + (0.4 + depth * 0.4) + ')';
      g.beginPath();
      g.ellipse(x + len * 0.15, y - len, 1.2 + depth * 2, 2.5 + depth * 3.5, 0.2, 0, Math.PI * 2);
      g.fill();
    }
    const ground = g.createLinearGradient(0, h * (Core.CATCH_Y + 0.06), 0, h);
    ground.addColorStop(0, 'rgba(110, 76, 34, 0)');
    ground.addColorStop(1, 'rgba(90, 60, 25, 0.55)');
    g.fillStyle = ground;
    g.fillRect(0, h * (Core.CATCH_Y + 0.06), w, h);
  }

  // ───────────── The game ─────────────

    async function renderIntro() {

    }

    function updateStartState(status, start) {
      const g = game();
      const s = settings();
      clearInterval(roundTimer);
      const tb = myTiebreak(g);
      start.disabled = false;
      start.textContent = 'Start';
      if (ctx.store.preview) {
        status.textContent = 'Preview: your score won’t be saved.';
        return;
      }
      if (!g) {
        status.textContent = 'This game isn’t available right now.';
        start.disabled = true;
        return;
      }
      if (tb) {
        status.textContent = 'Tie-breaker! One ' + Core.tiebreakSettings(s).roundSec + '-second run on a fresh pattern. Highest score wins.';
        start.textContent = 'Play the tie-breaker';
        return;
      }
      if (!g.playable) {
        start.disabled = true;
        status.textContent = { waiting: 'Waiting for the facilitator to start the game…', paused: 'Paused by the facilitator.', ended: 'This game has finished. Thanks for playing!' }[g.reason] || 'Not available right now.';
        return;
      }
      if (attemptsUsed >= s.attempts) {
        start.disabled = true;
        status.textContent = 'You’ve used all ' + s.attempts + ' attempts. Your best score counts!';
        return;
      }
      if (s.syncStart && ctx.store.mode === 'shared') {
        pollEvery(2000);
        const r = g.round;
        if (!r) {
          start.disabled = true;
          status.textContent = 'Waiting for the facilitator to launch the next round…';
          return;
        }
        const tick = () => {
          const left = r.startAt - ctx.store.now();
          if (left > 3500) {
            start.disabled = true;
            status.textContent = 'Synchronised round starts in ' + Math.ceil(left / 1000) + ' s. Stay on this screen!';
          } else if (left > -1000) {
            clearInterval(roundTimer);
            begin(r);
          } else {
            clearInterval(roundTimer);
            start.disabled = true;
            status.textContent = 'A round is under way. Wait here for the next one.';
          }
        };
        tick();
        roundTimer = setInterval(tick, 250);
        return;
      }
      const left = s.attempts - attemptsUsed;
      status.textContent = U.plural(left, 'attempt') + ' left. Your best score counts.';
    }

    function renderBoard(list, b) {
      const rows = (b.players || []).slice(0, 10).map((p) => ({
        key: p.key || p.nickname,
        rank: p.rank,
        name: p.nickname,
        detail: p.detail && p.detail.bestCombo != null ? 'Best combo ' + p.detail.bestCombo + ' · ' + p.detail.accuracy + '% accuracy' : U.plural(p.attempts || 1, 'attempt'),
        score: p.score,
        you: p.you,
      }));
      root.HubBoard.render(list, rows, { empty: 'No scores yet. Be the first!' });
    }

    // ---- Stage layout ----
    function layout() {
      const vw = root.innerWidth;
      const vh = root.innerHeight;
      const hudH = 64;
      const availH = vh - hudH - 12;
      let h = Math.min(availH, vw / Core.FIELD_ASPECT);
      let w = h * Core.FIELD_ASPECT;
      if (w > vw) {
        w = vw;
        h = w / Core.FIELD_ASPECT;
      }
      w = Math.floor(w);
      h = Math.floor(h);
      const dpr = Math.min(root.devicePixelRatio || 1, 2);
      field = { w, h, dpr, left: Math.floor((vw - w) / 2), top: Math.floor(hudH + (availH - h) / 2) };
      canvas.width = Math.round(w * dpr);
      canvas.height = Math.round(h * dpr);
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
      canvas.style.left = field.left + 'px';
      canvas.style.top = field.top + 'px';
      hud.style.width = Math.max(w, Math.min(vw, 560)) + 'px';
      bg = sprite(1, () => {});
      bg.width = canvas.width;
      bg.height = canvas.height;
      const bgc = bg.getContext('2d');
      bgc.scale(dpr, dpr);
      drawField(bgc, w, h);
      const size = Core.ITEM_R * 2 * w * dpr * 1.45;
      sprites = {
        sheaf: sprite(size, (g, s) => drawSheaf(g, s, false), true),
        golden: sprite(size * 1.15, (g, s) => drawSheaf(g, s, true), true),
        stone: sprite(size, drawStone, true),
        thorn: sprite(size, drawThorn, true),
        wide: sprite(size, (g, s) => drawPower(g, s, 'wide'), true),
        slow: sprite(size, (g, s) => drawPower(g, s, 'slow'), true),
        shield: sprite(size, (g, s) => drawPower(g, s, 'shield'), true),
      };
      if (sim) render();
    }

    let resizeTimer = null;
    function onResize() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(layout, 80);
    }

    // ---- Input ----
    function pointerX(e) {
      return (e.clientX - field.left) / field.w;
    }
    function onPointer(e) {
      if (!sim || localPaused || remotePaused) return;
      if (e.pointerType === 'mouse' || e.buttons || e.type === 'pointerdown') {
        sim.setBasket(pointerX(e));
        e.preventDefault();
      }
    }
    function onKey(e) {
      if (!sim) return;
      const down = e.type === 'keydown';
      const k = e.key;
      if (k === 'ArrowLeft' || k === 'a' || k === 'A') { keys.left = down; e.preventDefault(); }
      else if (k === 'ArrowRight' || k === 'd' || k === 'D') { keys.right = down; e.preventDefault(); }
      else if (down && (k === 'Escape' || k === 'p' || k === 'P')) { e.preventDefault(); if (localPaused) resume(); else pause(true); }
    }
    const preventGesture = (e) => e.preventDefault();
    function onVisibility() {
      if (document.hidden && sim && !sim.state.over) pause(true);
    }
    function onBlur() {
      if (sim && !sim.state.over && loop && loop.running) pause(true);
    }

    function attachInput() {
      stage.addEventListener('pointerdown', onPointer);
      stage.addEventListener('pointermove', onPointer);
      root.addEventListener('keydown', onKey);
      root.addEventListener('keyup', onKey);
      root.addEventListener('resize', onResize);
      root.addEventListener('orientationchange', onResize);
      root.addEventListener('blur', onBlur);
      document.addEventListener('visibilitychange', onVisibility);
      document.addEventListener('gesturestart', preventGesture);
      document.body.classList.add('playing');
    }
    function detachInput() {
      stage.removeEventListener('pointerdown', onPointer);
      stage.removeEventListener('pointermove', onPointer);
      root.removeEventListener('keydown', onKey);
      root.removeEventListener('keyup', onKey);
      root.removeEventListener('resize', onResize);
      root.removeEventListener('orientationchange', onResize);
      root.removeEventListener('blur', onBlur);
      document.removeEventListener('visibilitychange', onVisibility);
      document.removeEventListener('gesturestart', preventGesture);
      document.body.classList.remove('playing');
      keys.left = keys.right = false;
    }

    // ---- Run ----
    async function begin(round) {
      if (busy) return;
      const g = game();
      const tb = myTiebreak(g);
      const base = settings();
      const s = tb ? Core.tiebreakSettings(base) : base;
      const seed = tb ? tb.seed : round ? round.seed : (g && g.seed) || 'PRACTICE';
      busy = true;
      pollEvery(3000);
      root.HubSfx.unlock();
      run = { runId: null, seed, settings: s, tiebreak: tb ? tb.id : '', roundId: round ? round.id : '' };
      sim = Core.createSim(s, seed);
      particles = [];
      popups = [];
      hudCache = {};
      shake = 0;
      flash = 0;
      localPaused = false;
      remotePaused = false;
      intro.hidden = true;
      over.hidden = true;
      stage.hidden = false;
      overlay.hidden = true;
      layout();
      attachInput();
      render();
      updateHud();
      stage.focus({ preventScroll: true });
      const started = ctx.store.startRun(ID, { nickname: identity().nickname, seed, roundId: run.roundId, tiebreak: run.tiebreak });
      await U.countdown(countEl, root.HubSfx);
      if (destroyed || !sim) return;
      started.then((r) => { if (run) run.runId = r.runId; });
      loop = root.HubLoop.create({ step, render });
      // A pause pressed during the countdown holds until the player resumes.
      if (!localPaused && !remotePaused) loop.start();
    }

    function step(dt) {
      if (keys.left || keys.right) sim.setBasket(sim.state.basketX + (keys.right ? 1 : -1) * KEY_SPEED * dt);
      sim.step(dt);
      handleEvents();
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 0.9 * dt;
        p.life -= dt;
        if (p.life <= 0) particles.splice(i, 1);
      }
      for (let i = popups.length - 1; i >= 0; i--) {
        popups[i].y -= 0.12 * dt;
        popups[i].life -= dt;
        if (popups[i].life <= 0) popups.splice(i, 1);
      }
      shake = Math.max(0, shake - dt * 3);
      flash = Math.max(0, flash - dt * 2.5);
      if (sim.state.over) {
        loop.stop();
        finish(sim.state.reason);
      }
    }

    function burst(x, y, color, n) {
      if (reduced) return;
      for (let i = 0; i < n && particles.length < 140; i++) {
        const a = Math.random() * Math.PI * 2;
        const sp = 0.15 + Math.random() * 0.35;
        particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.25, life: 0.5 + Math.random() * 0.4, color, size: 2 + Math.random() * 3 });
      }
    }

    function popup(x, text, color) {
      popups.push({ x, y: Core.CATCH_Y - 0.05, text, color, life: 0.9 });
    }

    function handleEvents() {
      const evs = sim.events.splice(0);
      evs.forEach((ev) => {
        const y = Core.CATCH_Y;
        if (ev.type === 'catch') {
          root.HubSfx.play(ev.kind === 'golden' ? 'golden' : 'catch');
          burst(ev.x, y, ev.kind === 'golden' ? '#ffd54a' : '#e2bb5c', ev.kind === 'golden' ? 22 : 10);
          popup(ev.x, '+' + ev.pts + (ev.mult > 1 ? ' ×' + ev.mult : ''), ev.kind === 'golden' ? '#b07d16' : '#5a3d1e');
        } else if (ev.type === 'hit') {
          root.HubSfx.play('hazard');
          shake = reduced ? 0 : 1;
          flash = 1;
          burst(ev.x, y, '#7d2f1d', 14);
          popup(ev.x, '−1 life', '#a5452c');
          U.vibrate(60);
        } else if (ev.type === 'blocked') {
          root.HubSfx.play('power');
          burst(ev.x, y, '#f0d18a', 16);
          popup(ev.x, 'Blocked!', '#b07d16');
        } else if (ev.type === 'power') {
          root.HubSfx.play('power');
          burst(ev.x, y, '#ffffff', 16);
          popup(ev.x, { wide: 'Wide Basket!', slow: 'Slow Wind!', shield: 'Shield!' }[ev.kind], '#3f5f22');
        } else if (ev.type === 'near') {
          shake = reduced ? 0 : Math.max(shake, 0.35);
          popup(ev.x, 'Close!', '#6a5443');
        } else if (ev.type === 'miss') {
          root.HubSfx.play('miss');
        }
      });
      updateHud();
    }

    function updateHud() {
      const st = sim.state;
      const s = run.settings;
      const mult = sim.multiplier();
      const left = Math.max(0, s.roundSec - st.t);
      const values = {
        score: st.score,
        mult,
        lives: st.lives,
        wide: st.t < st.wideUntil,
        slow: st.t < st.slowUntil,
        shield: st.shield,
        bar: Math.round((left / s.roundSec) * 200),
      };
      if (values.score !== hudCache.score) hudScore.textContent = String(values.score);
      if (values.mult !== hudCache.mult) {
        hudMult.textContent = mult > 1 ? '×' + mult : '';
        hudMult.classList.toggle('on', mult > 1);
        if (mult > 1 && !reduced) hudMult.animate([{ transform: 'scale(1.35)' }, { transform: 'scale(1)' }], { duration: 260, easing: 'ease-out' });
      }
      if (values.lives !== hudCache.lives) {
        hudLives.textContent = '';
        for (let i = 0; i < s.lives; i++) hudLives.appendChild(U.svg('i-heart', i < st.lives ? 'life on' : 'life'));
        hudLives.setAttribute('aria-label', st.lives + ' lives left');
      }
      if (values.wide !== hudCache.wide || values.slow !== hudCache.slow || values.shield !== hudCache.shield) {
        hudPowers.textContent = '';
        if (values.wide) hudPowers.appendChild(el('span', 'power-chip wide', 'Wide'));
        if (values.slow) hudPowers.appendChild(el('span', 'power-chip slow', 'Slow'));
        if (values.shield) hudPowers.appendChild(el('span', 'power-chip shield', 'Shield'));
      }
      if (values.bar !== hudCache.bar) {
        hudBarFill.style.transform = 'scaleX(' + values.bar / 200 + ')';
        hudBar.classList.toggle('low', left <= 10);
      }
      hudCache = values;
    }

    function render() {
      const g = canvas.getContext('2d');
      const { w, h, dpr } = field;
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
      g.clearRect(0, 0, w, h);
      g.save();
      if (shake > 0) g.translate((Math.random() - 0.5) * 10 * shake, (Math.random() - 0.5) * 8 * shake);
      g.drawImage(bg, 0, 0, w, h);
      const st = sim.state;
      if (st.t < st.slowUntil && !reduced) {
        g.strokeStyle = 'rgba(63, 134, 168, 0.25)';
        g.lineWidth = 2;
        for (let i = 0; i < 6; i++) {
          const y = ((i * 0.17 + st.t * 0.05) % 1) * h;
          const x = ((i * 0.37 + st.t * 0.35) % 1.4 - 0.2) * w;
          g.beginPath();
          g.moveTo(x, y);
          g.lineTo(x + w * 0.25, y + 4);
          g.stroke();
        }
      }
      sim.active.forEach((a) => {
        const img = sprites[a.kind];
        const size = img.width / dpr;
        const wob = Math.sin(st.t * 3 + a.spin * 6) * 0.25;
        g.save();
        g.translate(a.x * w, a.y * h);
        g.rotate(Core.HAZARD[a.kind] ? st.t * 2 + a.spin * 6 : wob);
        g.drawImage(img, -size / 2, -size / 2, size, size);
        g.restore();
      });
      const bw = sim.basketHalf() * 2 * w;
      const bh = Math.min(bw * 0.42, h * 0.08);
      const top = Core.CATCH_Y * h;
      drawBasket(g, st.basketX * w, top, bw, bh, st.t < st.wideUntil ? 'rgba(120, 160, 60, 0.9)' : null);
      if (st.shield) {
        g.strokeStyle = 'rgba(240, 200, 90, 0.85)';
        g.lineWidth = 3;
        g.beginPath();
        g.ellipse(st.basketX * w, top + bh * 0.3, bw * 0.62, bh * 1.3, 0, Math.PI, 0);
        g.stroke();
      }
      particles.forEach((p) => {
        g.globalAlpha = Math.max(0, Math.min(1, p.life * 2));
        g.fillStyle = p.color;
        g.fillRect(p.x * w, p.y * h, p.size, p.size);
      });
      g.globalAlpha = 1;
      const fontSize = Math.max(14, w * 0.05);
      g.font = '700 ' + fontSize + 'px Inter, system-ui, sans-serif';
      g.textAlign = 'center';
      popups.forEach((p) => {
        g.globalAlpha = Math.min(1, p.life * 1.6);
        g.lineWidth = 4;
        g.strokeStyle = 'rgba(255, 248, 230, 0.9)';
        g.strokeText(p.text, p.x * w, p.y * h);
        g.fillStyle = p.color;
        g.fillText(p.text, p.x * w, p.y * h);
      });
      g.globalAlpha = 1;
      g.restore();
      if (flash > 0) {
        g.fillStyle = 'rgba(165, 69, 44,' + flash * 0.25 + ')';
        g.fillRect(0, 0, w, h);
      }
      if (sim && hudCache.bar !== undefined) {
        const left = Math.max(0, run.settings.roundSec - st.t);
        const bar = Math.round((left / run.settings.roundSec) * 200);
        if (bar !== hudCache.bar) updateHud();
      }
    }

    // ---- Pause ----
    function showOverlay(title, text, buttons) {
      overlay.textContent = '';
      const card = el('div', 'overlay-card');
      card.append(el('h2', 'display-sm', title));
      if (text) card.appendChild(el('p', 'lead', text));
      const row = el('div', 'actions');
      buttons.forEach((b) => row.appendChild(b));
      card.appendChild(row);
      overlay.appendChild(card);
      overlay.hidden = false;
      const first = row.querySelector('button');
      if (first) first.focus();
    }

    function pause(byPlayer) {
      if (!sim || sim.state.over || (byPlayer ? localPaused : remotePaused)) return;
      if (loop) loop.stop();
      keys.left = keys.right = false;
      if (byPlayer) {
        localPaused = true;
        showOverlay('Paused', 'Take a breath. Your run is waiting.', [U.button('Resume', 'btn btn-primary', resume), U.button('Quit run', 'btn btn-ghost', quit)]);
      } else {
        remotePaused = true;
        showOverlay('Paused by the facilitator', 'The game will continue in a moment.', []);
      }
    }

    function resume() {
      if (remotePaused) return;
      localPaused = false;
      overlay.hidden = true;
      stage.focus({ preventScroll: true });
      if (loop) loop.start();
    }

    function quit() {
      overlay.hidden = true;
      if (loop) loop.stop();
      finish('quit');
    }

    pauseBtn.addEventListener('click', () => (localPaused ? resume() : pause(true)));

    // ---- Finish ----
    async function finish(reason) {
      if (!sim) return;
      const result = sim.result();
      const thisRun = run;
      sim = null;
      detachInput();
      stage.hidden = true;
      overlay.hidden = true;
      busy = false;
      pollEvery(6000);
      root.HubSfx.play(reason === 'lives' ? 'end' : 'win');
      renderOver(result, reason, thisRun);
      if (reason !== 'quit' && result.score > 0) root.HubConfetti.burst({ count: result.score > lastBest ? 160 : 70 });
    }

    async function renderOver(result, reason, thisRun) {
      const g = game();
      over.textContent = '';
      const titles = { time: 'Time’s up!', lives: 'Out of lives!', quit: 'Run ended', ended: 'The facilitator ended the game' };
      over.append(el('p', 'eyebrow', thisRun.tiebreak ? 'Tie-breaker' : 'Run complete'), el('h2', 'display', titles[reason] || 'Run complete'));
      const best = result.score > lastBest && lastBest > 0;
      const stats = el('div', 'score-summary');
      function stat(v, label) {
        const b = el('div', 'stat');
        b.append(el('span', 'stat-value', String(v)), el('span', 'stat-label', label));
        return b;
      }
      stats.append(stat(result.score, 'points'), stat('×' + Core.multiplier(result.bestCombo) + ' · ' + result.bestCombo, 'best combo'), stat(result.accuracy + '%', 'accuracy'));
      over.appendChild(stats);
      if (best) over.appendChild(el('p', 'badge-best', 'New personal best!'));
      const note = el('p', 'game-status', 'Saving your score…');
      note.setAttribute('role', 'status');
      over.appendChild(note);
      const boardCard = el('div', 'card leaderboard-card');
      const bh = el('div', 'leaderboard-head');
      bh.append(el('h3', null, thisRun.tiebreak ? 'Your tie-breaker run' : 'Leaderboard'));
      const list = el('ol', 'leaderboard');
      boardCard.append(bh, list);
      over.appendChild(boardCard);
      if (g && g.closing) over.appendChild(el('p', 'closing-line', g.closing));
      const actions = el('div', 'actions');
      const again = U.button('Play again', 'btn btn-primary', () => renderIntro());
      actions.append(U.button('Back to games', 'btn btn-ghost', ctx.exit), again);
      over.appendChild(actions);
      intro.hidden = true;
      over.hidden = false;
      root.scrollTo(0, 0);
      over.querySelector('h2').setAttribute('tabindex', '-1');
      over.querySelector('h2').focus({ preventScroll: true });

      // Wait briefly for the run token if the countdown finished before the server answered.
      if (!thisRun.runId && ctx.store.mode === 'shared') await new Promise((r) => setTimeout(r, 1200));
      const res = await ctx.store.submitRun(ID, {
        runId: thisRun.runId,
        nickname: identity().nickname,
        result,
        localScore: result.score,
        tiebreak: thisRun.tiebreak,
        roundId: thisRun.roundId,
      });
      if (destroyed) return;
      if (res.saved === 'preview') note.textContent = 'Preview run: not saved.';
      else if (res.saved === 'shared' && res.ok !== false) note.textContent = res.rank ? 'Saved! You’re #' + res.rank + ' in this session.' : 'Saved to the shared leaderboard.';
      else if (res.saved === 'local' && ctx.store.mode === 'shared') note.textContent = 'Not saved to the shared leaderboard: ' + (res.message || 'connection problem') + ' It is kept on this device.';
      else note.textContent = 'Saved on this device.';
      if (thisRun.tiebreak) {
        list.appendChild(el('li', 'leaderboard-empty', 'Your score: ' + result.score + '. The facilitator will announce the winner.'));
      } else {
        const b = res.board || (await ctx.store.board(ID));
        renderBoard(list, b);
        const me = (b.players || []).find((p) => p.you && p.nickname.toLowerCase() === identity().nickname.toLowerCase());
        attemptsUsed = me ? me.attempts : attemptsUsed + 1;
        const s = settings();
        if (attemptsUsed >= s.attempts) {
          again.disabled = true;
          again.textContent = 'No attempts left';
        }
      }
    }

    // ---- Live updates from the facilitator ----
    function update() {
      const g = game();
      if (sim && !sim.state.over) {
        if (!g || g.status === 'ended' || g.reason === 'hidden') {
          if (loop) loop.stop();
          finish('ended');
          return;
        }
        if (g.status === 'paused' && !remotePaused) pause(false);
        else if (g.status === 'running' && remotePaused) {
          remotePaused = false;
          if (!localPaused) {
            overlay.hidden = true;
            if (loop) loop.start();
          }
        }
        return;
      }
      if (!intro.hidden) {
        const status = intro.querySelector('.game-status');
        const start = intro.querySelector('.join-form .btn-primary');
        if (status && start) updateStartState(status, start);
      }
    }

    function destroy() {
      destroyed = true;
      clearInterval(roundTimer);
      pollEvery(6000);
      if (loop) loop.stop();
      if (sim) detachInput();
      sim = null;
      stage.remove();
      shell.remove();
    }

    renderIntro();
    return { update, destroy, isBusy: () => busy };
  }

  root.HubGames = root.HubGames || {};
  root.HubGames[ID] = {
    mount,
    update: () => mounted && mounted.update(),
    unmount() {
      if (mounted) mounted.destroy();
      mounted = null;
    },
    isBusy: () => !!(mounted && mounted.isBusy()),
  };
})(window);
