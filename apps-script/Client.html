      btn.append(el('span', 'choice-letter', LETTERS[i]), el('span', 'choice-text', text), svgIcon('i-check', 'choice-mark mark-check'), svgIcon('i-x', 'choice-mark mark-x'));
      box.appendChild(btn);
    });

    $('feedback').hidden = true;
    $('facilitatorBar').hidden = !group;
    $('revealBtn').disabled = false;
    setPauseButton(false);
    $('pauseBtn').hidden = !game.durationSec;
    renderTeamStrip();
    updateScoreChip();

    questionStartedAt = performance.now();
    if (game.durationSec) startTimer();
    else {
      timer.stop();
      $('timer').classList.add('is-off');
    }
    $('questionPrompt').focus({ preventScroll: true });
  }

  function startTimer() {
    const wrap = $('timer');
    wrap.classList.remove('is-low', 'is-paused', 'is-off');
    let lastSecond = null;
    timer.start(
      game.durationSec,
      (remaining, total) => {
        const secs = Math.ceil(remaining / 1000);
        $('timerValue').textContent = String(secs);
        $('timerRing').style.strokeDashoffset = String(RING_LENGTH * (1 - remaining / total));
        wrap.classList.toggle('is-low', secs <= 5);
        if (secs !== lastSecond) {
          if (lastSecond !== null && secs > 0 && secs <= 3) Sound.tick();
          lastSecond = secs;
          wrap.setAttribute('aria-label', plural(secs, 'second') + ' remaining');
        }
      },
      onTimeUp
    );
  }

  function onTimeUp() {
    if (!game || game.phase !== 'question') return;
    Sound.timeUp();
    if (game.mode === 'individual') {
      showFeedback(game.timeout());
      return;
    }
    $('questionHint').textContent = 'Time’s up! Reveal the answer when the room is ready.';
    $('pauseBtn').hidden = true;
    announce('Time’s up.');
  }

  function choose(index) {
    if (!game || game.phase !== 'question') return;
    if (game.mode === 'group') {
      if (!game.answer(index)) return;
      Array.from($('choices').children).forEach((btn, i) => {
        btn.classList.toggle('is-selected', i === index);
        btn.setAttribute('aria-pressed', String(i === index));
      });
      return;
    }
    const elapsed = game.durationSec ? timer.elapsedMs() : performance.now() - questionStartedAt;
    timer.stop();
    const response = game.answer(index, elapsed);
    if (response) showFeedback(response);
  }

  $('choices').addEventListener('click', (e) => {
    const btn = e.target.closest('.choice');
    if (btn && !btn.disabled) choose(Number(btn.dataset.index));
  });

  function setPauseButton(paused) {
    const btn = $('pauseBtn');
    btn.querySelector('use').setAttribute('href', paused ? '#i-play' : '#i-pause');
    btn.querySelector('span').textContent = paused ? 'Resume' : 'Pause';
    $('timer').classList.toggle('is-paused', paused);
    if (paused) $('timerValue').textContent = 'Paused';
  }

  function togglePause() {
    if (!game || game.phase !== 'question' || !game.durationSec) return;
    if (timer.paused) {
      timer.resume();
      setPauseButton(false);
    } else if (timer.pause()) {
      setPauseButton(true);
    }
  }

  $('pauseBtn').addEventListener('click', togglePause);
  $('revealBtn').addEventListener('click', reveal);

  function reveal() {
    if (!game || game.mode !== 'group' || game.phase !== 'question') return;
    timer.stop();
    showFeedback(game.reveal());
  }

  function showFeedback(r) {
    timer.stop();
    const q = game.current();
    const group = game.mode === 'group';
    Array.from($('choices').children).forEach((btn, i) => {
      btn.disabled = true;
      btn.classList.remove('is-selected');
      btn.removeAttribute('aria-pressed');
      if (i === q.answer) btn.classList.add('is-correct');
      else if (i === r.choice) btn.classList.add('is-wrong');
      else btn.classList.add('is-dim');
    });
    $('progressFill').style.width = ((game.index + 1) / game.total) * 100 + '%';
    $('facilitatorBar').hidden = true;

    const verdict = $('verdict');
    verdict.textContent = '';
    let label;
    let kind;
    if (r.timedOut) { label = 'Time’s up'; kind = 'neutral'; }
    else if (group && r.choice === -1) { label = 'The answer'; kind = 'neutral'; }
    else if (r.correct) { label = 'Correct!'; kind = 'ok'; }
    else { label = 'Not quite'; kind = 'no'; }
    verdict.className = 'verdict ' + kind;
    if (kind !== 'neutral') verdict.appendChild(svgIcon(kind === 'ok' ? 'i-check' : 'i-x'));
    verdict.appendChild(document.createTextNode(label));

    const answerLine = LETTERS[q.answer] + ': ' + q.choices[q.answer];
    const text = $('feedbackText');
    text.textContent = '';
    if (!r.correct) {
      text.appendChild(el('strong', null, 'The answer is ' + answerLine + ' '));
      text.appendChild(document.createElement('br'));
    }
    text.appendChild(document.createTextNode(q.explanation));
    $('feedbackRef').textContent = q.reference;

    const pts = $('pointsEarned');
    if (group) pts.textContent = '';
    else {
      const bonus = r.points - E.POINTS_PER_CORRECT;
      pts.textContent = '+' + r.points + (r.correct && bonus > 0 ? ' (' + bonus + ' speed bonus)' : '');
    }

    $('teamAward').hidden = !group;
    if (group) renderTeamChips();

    const last = game.index + 1 >= game.total;
    $('nextBtn').textContent = last ? 'See results' : 'Next question';
    $('feedback').hidden = false;

    if (!r.timedOut && !(group && r.choice === -1)) (r.correct ? Sound.correct : Sound.wrong)();
    announce(label + '. The answer is ' + answerLine + '. ' + q.reference + '.');
    updateScoreChip();
    renderTeamStrip();
    $('nextBtn').focus({ preventScroll: true });
    $('feedback').scrollIntoView({ behavior: reducedMotion ? 'auto' : 'smooth', block: 'nearest' });
  }

  function renderTeamChips() {
    const box = $('teamChips');
    box.textContent = '';
    const players = game.players();
    const awarded = game.response().awarded;
    $('teamAwardLabel').textContent = players.length === 1 ? 'Did the room get it right?' : 'Tap each team that answered correctly:';
    players.forEach((p, i) => {
      const chip = el('button', 'team-chip');
      chip.type = 'button';
      chip.setAttribute('aria-pressed', String(awarded.indexOf(i) >= 0));
      chip.append(svgIcon('i-check'), document.createTextNode(players.length === 1 ? 'Yes, ' + p.name + ' got it' : p.name));
      chip.addEventListener('click', () => {
        const on = chip.getAttribute('aria-pressed') !== 'true';
        if (!game.setAward(i, on)) return;
        chip.setAttribute('aria-pressed', String(on));
        if (on) Sound.correct();
        renderTeamStrip(i);
      });
      box.appendChild(chip);
    });
  }

  function renderTeamStrip(bumpIndex) {
    const strip = $('teamStrip');
    if (!game || game.mode !== 'group') {
      strip.hidden = true;
      return;
    }
    strip.hidden = false;
    strip.textContent = '';
    game.players().forEach((p, i) => {
      const chip = el('span', 'team-score' + (i === bumpIndex ? ' bump' : ''));
      chip.append(document.createTextNode(p.name), el('strong', null, String(p.score)));
      strip.appendChild(chip);
    });
  }

  function updateScoreChip() {
    if (game && game.mode === 'individual') $('scoreValue').textContent = String(game.players()[0].score);
  }

  $('nextBtn').addEventListener('click', advance);

  function advance() {
    if (!game || game.phase !== 'revealed') return;
    if (game.next()) renderQuestion();
    else finishGame();
  }

  document.addEventListener('keydown', (e) => {
    if (e.defaultPrevented || e.ctrlKey || e.metaKey || e.altKey) return;
    if (screen !== 'question' || !game || $('settingsDialog').open) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    const key = e.key.toLowerCase();
    if (game.phase === 'question') {
      let index = ['1', '2', '3', '4'].indexOf(key);
      if (index < 0) index = ['a', 'b', 'c', 'd'].indexOf(key);
      if (index >= 0 && index < game.current().choices.length) {
        e.preventDefault();
        choose(index);
      } else if (game.mode === 'group' && key === 'r') {
        e.preventDefault();
        reveal();
      } else if (game.mode === 'group' && key === 'p') {
        e.preventDefault();
        togglePause();
      }
    } else if (game.phase === 'revealed' && (key === 'n' || key === 'arrowright')) {
      e.preventDefault();
      advance();
    }
  });

  // ───────────── Results ─────────────

  function finishGame() {
    timer.stop();
    const standings = game.standings();
    const summary = $('scoreSummary');
    summary.textContent = '';

    if (game.mode === 'individual') {
      const me = standings[0];
      const award = E.achievementFor(me.correct, game.total);
      $('resultsEyebrow').textContent = me.name + ', your achievement';
      $('achievementTitle').textContent = award.title;
      $('achievementBlurb').textContent = award.blurb;
      summary.append(stat(me.score, 'points', 'finalScore'), stat(me.correct + ' / ' + game.total, 'correct'));
      run.entryId = run.attemptId;
      saveLocalEntry({ id: run.entryId, name: me.name, score: me.score, correct: me.correct, total: game.total, at: Date.now() });
      renderLocalBoard();
      if (run.setup.session && B.kind !== 'none') submitShared();
    } else {
      const top = standings[0];
      const tied = standings.filter((t) => t.score === top.score);
      const award = E.achievementFor(top.correct, game.total);
      if (standings.length === 1) $('resultsEyebrow').textContent = 'The room’s achievement';
      else if (tied.length > 1) $('resultsEyebrow').textContent = 'A tie between ' + tied.map((t) => t.name).join(' and ');
      else $('resultsEyebrow').textContent = 'Winning team: ' + top.name;
      $('achievementTitle').textContent = award.title;
      $('achievementBlurb').textContent = award.blurb;
      summary.append(stat(top.score, 'points'), stat(top.correct + ' / ' + game.total, 'correct'));
      renderBoard({
        title: standings.length === 1 ? 'Final score' : 'Team standings',
        meta: plural(game.total, 'question'),
        rows: rankRows(standings).map((t) => ({ rank: t.rank, name: t.name, detail: t.correct + ' / ' + game.total + ' correct', score: t.score })),
        note: '',
      });
    }

    show('results');
    Sound.finish();
    confetti();
  }

  function stat(value, label, id) {
    const box = el('div', 'stat');
    const v = el('span', 'stat-value', String(value));
    if (id) v.id = id;
    box.append(v, el('span', 'stat-label', label));
    return box;
  }

  /** Standard competition ranking (1, 2, 2, 4) over rows already sorted by score. */
  function rankRows(rows) {
    let rank = 0;
    return rows.map((row, i) => {
      if (i === 0 || row.score !== rows[i - 1].score) rank = i + 1;
      return Object.assign({ rank }, row);
    });
  }

  function renderBoard(opts) {
    $('leaderboardTitle').textContent = opts.title;
    $('leaderboardMeta').textContent = opts.meta || '';
    fillBoard($('leaderboard'), opts.rows);
    setBoardNote(opts.note || '');
  }

  function fillBoard(list, rows) {
    list.textContent = '';
    if (!rows.length) {
      list.appendChild(el('li', 'leaderboard-empty', 'No scores yet.'));
      return;
    }
    rows.forEach((row) => {
      const li = el('li', row.you ? 'is-you' : '');
      const who = el('span', 'who', row.name);
      if (row.detail) who.appendChild(el('small', null, row.detail));
      li.append(el('span', 'rank', String(row.rank)), who, el('span', 'pts', String(row.score)));
      list.appendChild(li);
    });
  }

  function setBoardNote(content) {
    const note = $('leaderboardNote');
    note.textContent = '';
    if (typeof content === 'string') note.textContent = content;
    else note.append(...content);
  }

  function loadLocalBoard() {
    const list = store.get('sessionStorage', KEYS.board, []);
    return Array.isArray(list) ? list : [];
  }

  function saveLocalEntry(entry) {
    const list = loadLocalBoard().filter((e) => e.id !== entry.id);
    list.push(entry);
    store.set('sessionStorage', KEYS.board, list.slice(-50));
  }

  function renderLocalBoard() {
    const sorted = loadLocalBoard().sort((a, b) => b.score - a.score || a.at - b.at);
    const rows = rankRows(sorted)
      .slice(0, 10)
      .map((e) => ({ rank: e.rank, name: e.name, detail: e.correct + ' / ' + e.total + ' correct', score: e.score, you: e.id === run.entryId }));
    renderBoard({
      title: 'Leaderboard',
      meta: 'This device',
      rows,
      note: sorted.length > 1 ? '' : 'Pass the device on, or tap Play again, to add more players.',
    });
  }

  async function submitShared() {
    if (run.submitted) return;
    run.submitted = true;
    const thisRun = run;
    setBoardNote('Sending your score to the shared leaderboard…');
    try {
      const data = await B.call('submitScore', {
        session: run.setup.session,
        nickname: run.setup.players[0],
        deviceId,
        attemptId: run.attemptId,
        timerSec: game.durationSec,
        answers: game.answersForServer(),
      });
      if (thisRun !== run) return;
      const finalScore = $('finalScore');
      if (finalScore) finalScore.textContent = String(data.score);
      renderBoard({
        title: 'Shared leaderboard',
        meta: 'Session ' + data.session,
        rows: data.leaderboard.map((r) => ({ rank: r.rank, name: r.nickname, detail: r.correct + ' / ' + data.total + ' correct', score: r.score, you: r.you })),
        note: data.duplicate
          ? 'Your score was already recorded.'
          : 'You are #' + data.rank + ' of ' + plural(data.players, 'player') + ' in this session.',
      });
    } catch (err) {
      if (thisRun !== run) return;
      run.submitted = false;
      const retry = el('button', 'btn btn-link', 'Try again');
      retry.type = 'button';
      retry.addEventListener('click', submitShared);
      setBoardNote([document.createTextNode('Couldn’t reach the shared leaderboard: ' + err.message + ' Your score is saved on this device. '), retry]);
    }
  }

  function playAgain() {
    if (!run) return show('welcome');
    startGame(run.setup);
  }

  $('playAgainBtn').addEventListener('click', playAgain);
  $('reflectionAgainBtn').addEventListener('click', playAgain);
  $('toReflectionBtn').addEventListener('click', () => show('reflection', $('reflectionQuestion')));

  // ───────────── Reflection ─────────────

  function initReflection() {
    const r = C.reflection;
    $('reflectionQuestion').textContent = r.question;
    $('closingThought').textContent = r.closingThought;
    $('passageRef').textContent = r.passage.reference;
    const box = $('passageText');
    r.passage.verses.forEach((v) => {
      const p = el('p');
      p.append(el('sup', null, String(v.n)), document.createTextNode(v.text));
      box.appendChild(p);
    });
    $('passageNote').textContent = r.passage.translation + '. Read it from your preferred translation if you like.';
    $('transitionText').textContent = '“' + r.transition + '”';
    renderResponses();
  }

  function renderResponses() {
    const wall = $('responseWall');
    wall.textContent = '';
    const list = store.get('sessionStorage', KEYS.responses, []);
    (Array.isArray(list) ? list : []).forEach((text) => wall.appendChild(el('li', null, String(text))));
  }

  $('reflectionForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const input = $('reflectionInput');
    const text = input.value.replace(/[\u0000-\u001F\u007F]/g, ' ').replace(/\s+/g, ' ').trim().slice(0, 200);
    if (!text) {
      input.focus();
      return;
    }
    const list = store.get('sessionStorage', KEYS.responses, []);
    const next = (Array.isArray(list) ? list : []).concat(text).slice(-40);
    store.set('sessionStorage', KEYS.responses, next);
    $('responseWall').appendChild(el('li', null, text));
    input.value = '';
    input.focus();
  });

  // ───────────── Host: live shared leaderboard ─────────────

  let hostSession = '';
  let hostTimer = null;

  $('hostBtn').addEventListener('click', () => {
    const suggestion = page.session || prefs.hostSession || 'RUTH-' + Math.random().toString(36).slice(2, 5).toUpperCase();
    $('hostSession').value = suggestion;
    $('hostError').textContent = '';
    $('hostLive').hidden = true;
    show('host');
  });

  $('hostForm').addEventListener('submit', (e) => {
    e.preventDefault();
    const code = E.normalizeSession($('hostSession').value);
    $('hostError').textContent = code ? '' : 'Session codes are 3–16 letters or numbers.';
    if (!code) return;
    prefs.hostSession = code;
    savePrefs();
    $('hostSession').value = code;
    hostSession = code;
    $('joinUrl').textContent = page.appUrl + '?mode=individual&session=' + encodeURIComponent(code);
    $('joinCode').textContent = code;
    $('hostLive').hidden = false;
    stopHostPolling();
    pollHost();
  });

  async function pollHost() {
    if (screen !== 'host' || !hostSession) return;
    const code = hostSession;
    if (!document.hidden) {
      try {
        const data = await B.call('leaderboard', { session: code, deviceId });
        if (screen !== 'host' || code !== hostSession) return;
        fillBoard($('hostBoard'), data.leaderboard.map((r) => ({ rank: r.rank, name: r.nickname, detail: r.correct + ' / ' + data.total + ' correct', score: r.score })));
        $('hostMeta').textContent = plural(data.players, 'player') + ' · updated ' + new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      } catch (err) {
        $('hostMeta').textContent = 'Reconnecting…';
      }
    }
    if (screen === 'host' && code === hostSession) hostTimer = setTimeout(pollHost, 5000);
  }

  function stopHostPolling() {
    clearTimeout(hostTimer);
    hostTimer = null;
  }

  // ───────────── Settings (the hub opens the dialog and owns theme and sound) ─────────────

  $('settingsBtn').addEventListener('click', () => {
    $('timerSelect').value = String(prefs.timerSec);
  });

  $('timerSelect').addEventListener('change', (e) => {
    prefs.timerSec = E.normalizeTimer(e.target.value);
    savePrefs();
  });

  $('clearBoardBtn').addEventListener('click', () => {
    store.remove('sessionStorage', KEYS.board);
    store.remove('sessionStorage', KEYS.responses);
    renderResponses();
    if (screen === 'results' && game && game.mode === 'individual') {
      run.entryId = null;
      renderLocalBoard();
    }
    toast('This device’s leaderboard and responses were cleared.');
  });

  // ───────────── Hub entry points ─────────────

  window.RedeemerGame = {
    /** Shows the quiz's welcome screen. Content must be in window.REDEEMER_CONTENT. */
    enter() {
      if (!C) {
        C = window.REDEEMER_CONTENT;
        initWelcome();
        initReflection();
        if (B.kind !== 'none') B.check().then(renderBackendStatus);
      }
      show('welcome');
    },
    leave() {
      timer.stop();
      stopHostPolling();
      SCREENS.forEach((s) => { $('screen-' + s).hidden = true; });
      $('scoreChip').hidden = true;
    },
    /** True while a question is on screen, so the hub asks before leaving. */
    isBusy: () => screen === 'question' && !!game && game.phase !== 'finished',
  };

  // Exposed for automated browser checks only.
  window.__redeemer = { get game() { return game; }, get screen() { return screen; } };
})();


/* ── game.js ── */
/*
 * The game hub: the participant menu, navigation between games, and the shared header
 * (title, sound, settings). Each game lives in games/; the session rules in shared/.
 *
 * Routes: #/ (menu) and #/play/<game-id>. A game that is hidden, disabled or unknown is
 * never mounted: the route shows "not available" instead. In the Apps Script version the
 * route comes from the page URL (?game=…) because the app runs inside a Google frame.
 */
(function (root) {
  'use strict';

  const U = root.HubUtil;
  const Store = root.HubStore;
  const Prefs = root.HubPrefs;
  const $ = U.$;

  const INFO = {
    'gleaners-rush': { kind: 'Arcade', icon: 'i-stalk', meta: (s) => s.roundSec + ' s · ' + U.plural(s.lives, 'life', 'lives'), action: 'Play' },
    'redeemers-challenge': { kind: 'Quiz', icon: 'i-book', meta: () => '8 questions on Ruth 4', action: 'Play' },
    'road-to-bethlehem': { kind: 'Puzzle', icon: 'i-road', meta: (s) => (s.timerMode === 'total' ? U.formatClock(s.totalSec * 1000) + ' round' : s.perLevelSec + ' s per level'), action: 'Play' },
    'team-showdown': { kind: 'Team game show', icon: 'i-buzz', meta: (s) => s.teamCount + ' teams · buzzers', action: 'Join' },
  };
  const REASONS = {
    open: 'Open',
    waiting: 'Waiting for the facilitator',
    paused: 'Paused',
    ended: 'Finished',
    preview: 'Preview',
  };

  const ds = document.body.dataset;
  const query = new URLSearchParams(root.location.search);
  const isGas = !!(root.google && root.google.script && root.google.script.run);
  const wantsPreview = ds.preview === '1' || query.get('preview') === '1';

  let route = { name: 'hub', game: null };
  let mountedId = null;
  let leaveArmedUntil = 0;
  let lastLive = null;

  // ───────────── Header ─────────────

  function renderSoundButton() {
    const on = Prefs.sound();
    const btn = $('soundBtn');
    btn.setAttribute('aria-pressed', String(on));
    btn.setAttribute('aria-label', on ? 'Sound effects on' : 'Sound effects off');
    btn.querySelector('use').setAttribute('href', on ? '#i-sound-on' : '#i-sound-off');
    $('soundCheck').checked = on;
  }

  function setSound(on) {
    Prefs.set({ sound: !!on });
    renderSoundButton();
    if (on) {
      root.HubSfx.unlock();
      root.HubSfx.play('catch');
    }
  }

  $('soundBtn').addEventListener('click', () => {
    setSound(!Prefs.sound());
    U.toast(Prefs.sound() ? 'Sound effects on' : 'Sound effects off', 1600);
  });
  $('soundCheck').addEventListener('change', (e) => setSound(e.target.checked));

  $('settingsBtn').addEventListener('click', () => {
    $('themeSelect').value = Prefs.get().theme;
    $('soundCheck').checked = Prefs.sound();
    const dialog = $('settingsDialog');
    if (typeof dialog.showModal === 'function') dialog.showModal();
    else dialog.setAttribute('open', '');
  });
  $('settingsDialog').addEventListener('submit', () => {
    const dialog = $('settingsDialog');
    if (typeof dialog.showModal !== 'function') dialog.removeAttribute('open');
  });
  $('themeSelect').addEventListener('change', (e) => Prefs.set({ theme: e.target.value }));

  function busy() {
    if (route.name !== 'play') return false;
    if (route.game === 'redeemers-challenge') return root.RedeemerGame.isBusy();
    const g = root.HubGames[route.game];
    return !!(g && g.isBusy());
  }

  /** Leaving mid-game needs a second tap, so a stray touch on a projector doesn't end a round. */
  function goHomeGuarded() {
    if (busy() && Date.now() > leaveArmedUntil) {
      leaveArmedUntil = Date.now() + 3000;
      U.toast('Tap again to leave this game.');
      return;
    }
    navigate({ name: 'hub' });
  }
  $('brandBtn').addEventListener('click', goHomeGuarded);
  $('hubBackBtn').addEventListener('click', goHomeGuarded);
  $('blockedBack').addEventListener('click', () => navigate({ name: 'hub' }));

  // ───────────── Routing ─────────────

  function parseHash() {
    const m = /^#\/play\/([a-z-]+)/.exec(root.location.hash || '');
    return m ? { name: 'play', game: m[1] } : { name: 'hub' };
  }

  function initialRoute() {
    if (ds.game) return { name: 'play', game: ds.game };
    if (query.get('game')) return { name: 'play', game: query.get('game') };
    return parseHash();
  }

  function navigate(next) {
    if (!isGas) {
      const hash = next.name === 'play' ? '#/play/' + next.game : '#/';
      if (root.location.hash !== hash) {
        root.location.hash = hash; // triggers hashchange → apply()
        return;
      }
    }
    route = next;
    apply();
  }

  root.addEventListener('hashchange', () => {
    if (isGas) return;
    route = parseHash();
    apply();
  });

  function unmountCurrent() {
    if (!mountedId) return;
    if (mountedId === 'redeemers-challenge') {
      root.RedeemerGame.leave();
      $('redeemer-root').hidden = true;
    } else if (root.HubGames[mountedId]) root.HubGames[mountedId].unmount();
    mountedId = null;
    $('gameRoot').textContent = '';
  }

  function showScreen(name) {
    $('screen-hub').hidden = name !== 'hub';
    $('screen-play').hidden = name !== 'play';
    $('screen-blocked').hidden = name !== 'blocked';
    $('redeemer-root').hidden = name !== 'redeemer';
    $('hubBackBtn').hidden = name === 'hub';
  }

  async function apply() {
    $('previewRibbon').hidden = !Store.preview;
    if (route.name === 'hub') {
      unmountCurrent();
      showScreen('hub');
      renderHub();
      document.title = sessionTitle();
      root.scrollTo(0, 0);
      return;
    }
    const id = route.game;
    const g = Store.game(id);
    if (!g) return blocked('This game isn’t available right now. The facilitator may have hidden it, or it isn’t part of this session.');
    if (id === 'redeemers-challenge' && !g.playable) return blocked(REASONS[g.reason] ? REASONS[g.reason] + '. The Redeemer’s Challenge will open when the facilitator is ready.' : 'Not available right now.');
    if (mountedId === id) return;
    unmountCurrent();
    mountedId = id;
    document.title = g.title + ' · ' + sessionTitle();
    if (id === 'redeemers-challenge') {
      showScreen('redeemer');
      try {
        await Store.redeemerContent();
      } catch (e) {
        mountedId = null;
        return blocked('Couldn’t load the quiz: ' + e.message);
      }
      if (mountedId !== id) return;
      root.RedeemerGame.enter();
      return;
    }
    showScreen('play');
    const ctx = {
      store: Store,
      identity: {
        get: () => ({ nickname: Prefs.get().nickname, team: Prefs.get().team }),
        set: (patch) => Prefs.set(patch),
      },
      exit: () => navigate({ name: 'hub' }),
    };
    root.HubGames[id].mount($('gameRoot'), ctx);
    root.scrollTo(0, 0);
  }

  function blocked(message) {
    unmountCurrent();
    showScreen('blocked');
    $('blockedText').textContent = message;
    $('blockedTitle').focus({ preventScroll: true });
  }

  // ───────────── Menu ─────────────

  function sessionTitle() {
    const st = Store.state();
    return st ? st.session.title : 'Ruth 4 Game Night';
  }

  function renderHub() {
    const st = Store.state();
    if (!st) return;
    $('brandName').textContent = st.session.title;
    $('hubTitle').textContent = st.session.title;
    $('hubWelcome').textContent = st.session.welcome;
    $('previewRibbon').hidden = !Store.preview;
    const mode = $('hubMode');
    mode.textContent = '';
    const dot = U.el('span', 'dot' + (Store.mode === 'shared' ? ' ok' : ''));
    mode.append(dot, document.createTextNode(Store.mode === 'shared' ? 'Connected to the session' : 'Playing on this device'));
    renderNickname();

    const list = $('gameList');
    list.textContent = '';
    if (!st.games.length) {
      list.appendChild(U.el('p', 'empty-note', 'No games are open yet. Hang tight: the facilitator will open the first one soon.'));
    }
    st.games.forEach((g, i) => {
      const info = INFO[g.id];
      const card = U.el('article', 'game-card' + (g.live ? ' is-live' : '') + (g.playable ? '' : ' is-locked'));
      const icon = U.el('div', 'game-card-icon');
      icon.appendChild(U.svg(info.icon));
      const body = U.el('div', 'game-card-body');
      body.appendChild(U.el('p', 'eyebrow', 'Game ' + (i + 1) + ' · ' + info.kind));
      body.appendChild(U.el('h3', null, g.title));
      body.appendChild(U.el('p', 'game-card-desc', g.description));
      const chips = U.el('div', 'chips');
      if (g.live) chips.appendChild(U.el('span', 'chip chip-live', 'Live now'));
      chips.appendChild(U.el('span', 'chip chip-' + g.reason, REASONS[g.reason] || g.reason));
      if (info.meta) chips.appendChild(U.el('span', 'chip', info.meta(g.settings || {})));
      body.appendChild(chips);
      const btn = U.button(g.playable || g.id !== 'redeemers-challenge' ? info.action : 'Not open yet', 'btn ' + (g.live ? 'btn-primary' : 'btn-ghost'), () => navigate({ name: 'play', game: g.id }));
      if (!g.playable && g.id === 'redeemers-challenge') btn.disabled = true;
      btn.setAttribute('aria-label', info.action + ': ' + g.title);
      card.append(icon, body, btn);
      list.appendChild(card);
    });

    const banner = $('liveBanner');
    const liveGame = st.games.find((g) => g.live);
    banner.hidden = !liveGame;
    if (liveGame) {
      $('liveName').textContent = liveGame.title;
      $('liveJoin').onclick = () => navigate({ name: 'play', game: liveGame.id });
    }
  }

  function renderNickname() {
    const nick = Prefs.get().nickname;
    const box = $('hubNick');
    box.textContent = '';
    if (nick) {
      box.append(document.createTextNode('Playing as '), U.el('strong', null, nick), document.createTextNode(' · '));
      box.appendChild(U.button('change', 'btn btn-link btn-inline', editNickname));
    } else {
      box.appendChild(U.button('Choose a nickname', 'btn btn-link btn-inline', editNickname));
    }
  }

  function editNickname() {
    const box = $('hubNick');
    box.textContent = '';
    const form = U.el('form', 'inline-field');
    form.noValidate = true;
    const input = U.el('input', 'input');
    input.maxLength = 20;
    input.value = Prefs.get().nickname;
    input.setAttribute('aria-label', 'Your nickname');
    const save = U.el('button', 'btn btn-primary', 'Save');
    save.type = 'submit';
    form.append(input, save);
    box.appendChild(form);
    input.focus();
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const n = root.RedeemerEngine.validateNickname(input.value);
      if (!n.ok) {
        U.toast(n.error);
        return;
      }
      Prefs.set({ nickname: n.value });
      renderNickname();
    });
  }

  // ───────────── Live updates ─────────────

  function onStoreChange() {
    const st = Store.state();
    if (!st) return;
    $('brandName').textContent = st.session.title;
    if (st.liveGame && st.liveGame !== lastLive && lastLive !== undefined && route.game !== st.liveGame) {
      const g = st.games.find((x) => x.id === st.liveGame);
      if (g) U.toast('Now live: ' + g.title, 4000);
    }
    lastLive = st.liveGame;
    if (route.name === 'hub') {
      renderHub();
      return;
    }
    if (route.name !== 'play') return;
    const g = Store.game(route.game);
    if (!g) {
      // The facilitator hid this game. Running games finish their round first.
      if (mountedId && mountedId !== 'redeemers-challenge' && root.HubGames[mountedId]) root.HubGames[mountedId].update();
      if (!busy()) blocked('The facilitator has closed this game for now.');
      return;
    }
    if (mountedId && mountedId !== 'redeemers-challenge' && root.HubGames[mountedId]) root.HubGames[mountedId].update();
  }

  // ───────────── Start ─────────────

  renderSoundButton();
  Store.init({ role: 'participant', preview: wantsPreview })
    .then(() => {
      lastLive = Store.state() ? Store.state().liveGame : null;
      Store.subscribe(onStoreChange);
      $('hubLoading').hidden = true;
      route = initialRoute();
      apply();
    })
    .catch((e) => {
      console.error(e);
      $('hubLoading').textContent = 'Something went wrong while loading. Please refresh the page.';
    });
})(window);
</script>
