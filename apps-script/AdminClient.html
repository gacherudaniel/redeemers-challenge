/* ── shared/util.js ── */
/*
 * Small browser helpers shared by the hub, the games and the admin dashboard.
 */
(function (root) {
  'use strict';

  const U = {};

  U.$ = (id) => document.getElementById(id);

  U.el = function (tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  };

  /** A button with optional class, text and click handler. */
  U.button = function (text, cls, onClick) {
    const btn = U.el('button', cls || 'btn btn-ghost', text);
    btn.type = 'button';
    if (onClick) btn.addEventListener('click', onClick);
    return btn;
  };

  U.svg = function (id, cls) {
    const ns = 'http://www.w3.org/2000/svg';
    const svg = document.createElementNS(ns, 'svg');
    svg.setAttribute('aria-hidden', 'true');
    if (cls) svg.setAttribute('class', cls);
    const use = document.createElementNS(ns, 'use');
    use.setAttribute('href', '#' + id);
    svg.appendChild(use);
    return svg;
  };

  // Browser storage is optional: private windows and sandboxed frames may block it.
  U.store = {
    get(area, key, fallback) {
      try {
        const raw = root[area].getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch (e) {
        return fallback;
      }
    },
    set(area, key, value) {
      try {
        root[area].setItem(key, JSON.stringify(value));
        return true;
      } catch (e) {
        return false;
      }
    },
    remove(area, key) {
      try { root[area].removeItem(key); } catch (e) { /* not available */ }
    },
  };

  U.uuid = function () {
    if (root.crypto && root.crypto.randomUUID) return root.crypto.randomUUID();
    const bytes = new Uint8Array(16);
    if (root.crypto && root.crypto.getRandomValues) root.crypto.getRandomValues(bytes);
    else for (let i = 0; i < 16; i++) bytes[i] = Math.floor(Math.random() * 256);
    return Array.from(bytes, (b) => b.toString(16).padStart(2, '0')).join('').replace(/^(.{8})(.{4})(.{4})(.{4})/, '$1-$2-$3-$4-');
  };

  /** Shares the device id with The Redeemer's Challenge so one phone is one player. */
  U.deviceId = (function () {
    let cached = null;
    return function () {
      if (cached) return cached;
      let id = U.store.get('localStorage', 'redeemer.device.v1', null);
      if (typeof id !== 'string' || !/^[A-Za-z0-9-]{16,64}$/.test(id)) {
        id = U.uuid();
        U.store.set('localStorage', 'redeemer.device.v1', id);
      }
      cached = id;
      return id;
    };
  })();

  U.clamp = (v, min, max) => Math.min(max, Math.max(min, v));

  U.plural = (n, word, many) => n + ' ' + (n === 1 ? word : many || word + 's');

  U.formatClock = function (ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60);
    const s = total % 60;
    return m + ':' + String(s).padStart(2, '0');
  };

  U.formatSeconds = function (ms) {
    return (Math.max(0, ms) / 1000).toFixed(1) + 's';
  };

  /** A short buzz on phones that support it, only after the player has interacted. */
  U.vibrate = function (ms) {
    const nav = root.navigator;
    if (!nav || !nav.vibrate || !(nav.userActivation && nav.userActivation.hasBeenActive)) return;
    try { nav.vibrate(ms); } catch (e) { /* not allowed */ }
  };

  U.reducedMotion = function () {
    return !!(root.matchMedia && root.matchMedia('(prefers-reduced-motion: reduce)').matches);
  };

  let toastTimer = null;
  U.toast = function (message, ms) {
    const el = U.$('toast');
    if (!el) return;
    el.textContent = message;
    el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => { el.hidden = true; }, ms || 3200);
  };

  /** Plain-text CSV. Cells starting with = + - @ are prefixed so spreadsheets don't run them. */
  U.toCsv = function (rows) {
    return rows
      .map((row) =>
        row
          .map((cell) => {
            let text = cell == null ? '' : String(cell);
            if (/^[=+\-@]/.test(text)) text = "'" + text;
            return /[",\n\r]/.test(text) ? '"' + text.replace(/"/g, '""') + '"' : text;
          })
          .join(',')
      )
      .join('\r\n');
  };

  /** Animated "3, 2, 1, Go!" in the given element. Resolves when finished. */
  U.countdown = function (el, sfx) {
    return new Promise((resolve) => {
      const steps = ['3', '2', '1', 'Go!'];
      let i = 0;
      el.hidden = false;
      function tick() {
        if (i >= steps.length) {
          el.hidden = true;
          el.textContent = '';
          resolve();
          return;
        }
        el.textContent = steps[i];
        el.classList.remove('pop');
        void el.offsetWidth; // restart the animation
        el.classList.add('pop');
        if (sfx) sfx.play(i < 3 ? 'count' : 'go');
        i += 1;
        setTimeout(tick, i === steps.length ? 450 : 750);
      }
      tick();
    });
  };

  root.HubUtil = U;
})(window);


/* ── shared/rng.js ── */
/*
 * Seeded random numbers. The same seed always produces the same sequence on every
 * device (and on the Apps Script server), which is what makes the arcade and puzzle
 * games fair: everyone in a session faces the same falling objects and the same levels.
 */
(function (root, factory) {
  if (typeof module === 'object' && module.exports) module.exports = factory();
  else root.HubRng = factory();
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const SEED_ALPHABET = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // no 0/O, 1/I

  /** A 32-bit hash of a string (MurmurHash3-style finaliser). */
  function hashString(text) {
    const str = String(text);
    let h = 1779033703 ^ str.length;
    for (let i = 0; i < str.length; i++) {
      h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
      h = (h << 13) | (h >>> 19);
    }
    h = Math.imul(h ^ (h >>> 16), 2246822507);
    h = Math.imul(h ^ (h >>> 13), 3266489909);
    return (h ^ (h >>> 16)) >>> 0;
  }

  /** mulberry32: small, fast and good enough for games. */
  function create(seed) {
    let state = typeof seed === 'number' ? seed >>> 0 : hashString(seed);
    function next() {
      state = (state + 0x6d2b79f5) >>> 0;
      let t = state;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    }
    return {
      next,
      /** Integer in [min, max], inclusive. */
      int(min, max) {
        return min + Math.floor(next() * (max - min + 1));
      },
      range(min, max) {
        return min + next() * (max - min);
      },
      chance(p) {
        return next() < p;
      },
      pick(list) {
        return list[Math.floor(next() * list.length)];
      },
      shuffle(list) {
        const out = list.slice();
        for (let i = out.length - 1; i > 0; i--) {
          const j = Math.floor(next() * (i + 1));
          const tmp = out[i];
          out[i] = out[j];
          out[j] = tmp;
        }
        return out;
      },
    };
  }

  /** A fresh, human-friendly seed such as "K7QM2A". */
  function newSeed(random) {
    const rand = random || Math.random;
    let out = '';
    for (let i = 0; i < 6; i++) out += SEED_ALPHABET.charAt(Math.floor(rand() * SEED_ALPHABET.length));
    return out;
  }

  /** Seeds are 3–16 letters, numbers or dashes. Returns '' if invalid. */
  function normalizeSeed(raw) {
    const s = String(raw == null ? '' : raw).toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 16);
    return s.length >= 3 ? s : '';
  }

  return { hashString, create, newSeed, normalizeSeed, SEED_ALPHABET };
});


/* ── shared/prefs.js ── */
/*
 * Per-device preferences shared by every game: sound, theme, nickname and team.
 * Sound is off by default.
 */
(function (root) {
  'use strict';

  const KEY = 'hub.prefs.v1';
  const store = root.HubUtil.store;
  const listeners = [];

  const prefs = Object.assign({ sound: false, theme: 'auto', nickname: '', team: '' }, store.get('localStorage', KEY, {}));
  if (['auto', 'light', 'dark'].indexOf(prefs.theme) < 0) prefs.theme = 'auto';
  prefs.sound = prefs.sound === true;

  function applyTheme() {
    if (prefs.theme === 'light' || prefs.theme === 'dark') document.documentElement.setAttribute('data-theme', prefs.theme);
    else document.documentElement.removeAttribute('data-theme');
  }

  root.HubPrefs = {
    get: () => Object.assign({}, prefs),
    sound: () => prefs.sound,
    set(patch) {
      Object.assign(prefs, patch);
      store.set('localStorage', KEY, prefs);
      if ('theme' in patch) applyTheme();
      listeners.forEach((fn) => fn(Object.assign({}, prefs)));
    },
    onChange(fn) {
      listeners.push(fn);
    },
    applyTheme,
  };

  applyTheme();
})(window);


/* ── shared/sfx.js ── */
/*
 * Sound effects made with Web Audio (no audio files). Silent unless the player has
 * turned sound on.
 */
(function (root) {
  'use strict';

  let ctx = null;

  function ready() {
    if (!root.HubPrefs || !root.HubPrefs.sound()) return null;
    try {
      if (!ctx) {
        const AC = root.AudioContext || root.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    } catch (e) {
      return null;
    }
  }

  function tone(freq, at, dur, type, peak, slideTo) {
    const c = ready();
    if (!c) return;
    const t0 = c.currentTime + at;
    const osc = c.createOscillator();
    const gain = c.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.exponentialRampToValueAtTime(peak || 0.07, t0 + 0.015);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain).connect(c.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  const SOUNDS = {
    catch: () => tone(660, 0, 0.09, 'triangle', 0.05, 880),
    golden: () => { tone(784, 0, 0.1, 'triangle', 0.06); tone(1175, 0.07, 0.18, 'triangle', 0.06); },
    hazard: () => tone(180, 0, 0.3, 'sawtooth', 0.05, 90),
    power: () => { tone(520, 0, 0.12, 'sine', 0.06, 1040); tone(1040, 0.1, 0.15, 'sine', 0.04); },
    miss: () => tone(300, 0, 0.12, 'sine', 0.03, 220),
    count: () => tone(523, 0, 0.12, 'square', 0.03),
    go: () => tone(784, 0, 0.25, 'square', 0.04),
    tick: () => tone(880, 0, 0.05, 'square', 0.02),
    rotate: () => tone(420, 0, 0.05, 'triangle', 0.035, 520),
    locked: () => tone(160, 0, 0.12, 'square', 0.03),
    solve: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.08, 0.25, 'triangle', 0.05)),
    buzz: () => tone(220, 0, 0.35, 'sawtooth', 0.06, 200),
    correct: () => { tone(523, 0, 0.16, 'triangle', 0.06); tone(784, 0.1, 0.3, 'triangle', 0.06); },
    wrong: () => { tone(233, 0, 0.24, 'sine', 0.06); tone(185, 0.12, 0.32, 'sine', 0.05); },
    win: () => [523, 659, 784, 1047, 1319].forEach((f, i) => tone(f, i * 0.1, 0.4, 'triangle', 0.05)),
    end: () => { tone(392, 0, 0.2, 'sine', 0.06); tone(294, 0.16, 0.4, 'sine', 0.06); },
  };

  root.HubSfx = {
    unlock: ready,
    play(name) {
      const fn = SOUNDS[name];
      if (fn) fn();
    },
  };
})(window);


/* ── shared/confetti.js ── */
/*
 * Celebration confetti on the shared #confetti canvas. Skipped for reduced motion.
 */
(function (root) {
  'use strict';

  let run = 0;

  function burst(opts) {
    if (root.HubUtil.reducedMotion()) return;
    const canvas = document.getElementById('confetti');
    const ctx = canvas && canvas.getContext && canvas.getContext('2d');
    if (!ctx) return;
    const id = ++run;
    const dpr = Math.min(root.devicePixelRatio || 1, 2);
    const w = root.innerWidth;
    const h = root.innerHeight;
    canvas.width = w * dpr;
    canvas.height = h * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const css = getComputedStyle(document.documentElement);
    const colors = ['--gold', '--olive', '--clay', '--gold-soft', '--accent'].map((v) => css.getPropertyValue(v).trim() || '#b88a2c');
    const count = Math.min((opts && opts.count) || 150, Math.round(w / 5));
    const pieces = Array.from({ length: count }, (_, i) => ({
      x: Math.random() * w,
      y: -20 - Math.random() * h * 0.6,
      vx: (Math.random() - 0.5) * 2.4,
      vy: 2 + Math.random() * 3,
      rot: Math.random() * Math.PI,
      vr: (Math.random() - 0.5) * 0.2,
      size: 6 + Math.random() * 6,
      color: colors[i % colors.length],
    }));
    const started = root.performance.now();
    function frame(now) {
      if (id !== run) return;
      ctx.clearRect(0, 0, w, h);
      let alive = false;
      for (const p of pieces) {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.035;
        p.rot += p.vr;
        if (p.y < h + 20) alive = true;
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        ctx.fillStyle = p.color;
        ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 1.4 * Math.abs(Math.cos(p.rot)) + 1);
        ctx.restore();
      }
      if (alive && now - started < 5000) root.requestAnimationFrame(frame);
      else ctx.clearRect(0, 0, w, h);
    }
    root.requestAnimationFrame(frame);
  }

  root.HubConfetti = { burst };
})(window);


/* ── shared/leaderboard.js ── */
/*
 * Animated leaderboard lists. Rows slide to their new positions when ranks change
 * (FLIP technique), and rows that moved up flash briefly.
 *
 * rows: [{ key, rank, name, detail, score, you }]
 */
(function (root) {
  'use strict';

  const U = root.HubUtil;

  function render(list, rows, opts) {
    opts = opts || {};
    const before = new Map();
    const oldRanks = new Map();
    Array.from(list.children).forEach((li) => {
      if (li.dataset.key) {
        before.set(li.dataset.key, li.getBoundingClientRect().top);
        oldRanks.set(li.dataset.key, Number(li.dataset.rank));
      }
    });

    list.textContent = '';
    if (!rows.length) {
      list.appendChild(U.el('li', 'leaderboard-empty', opts.empty || 'No scores yet.'));
      return;
    }

    const limit = opts.limit || rows.length;
    rows.slice(0, limit).forEach((row) => {
      const li = U.el('li', row.you ? 'is-you' : '');
      li.dataset.key = row.key;
      li.dataset.rank = String(row.rank);
      const who = U.el('span', 'who', row.name);
      if (row.detail) who.appendChild(U.el('small', null, row.detail));
      li.append(U.el('span', 'rank', String(row.rank)), who, U.el('span', 'pts', String(row.score)));
      list.appendChild(li);
    });

    if (U.reducedMotion()) return;
    Array.from(list.children).forEach((li) => {
      const key = li.dataset.key;
      if (!key) return;
      const prevTop = before.get(key);
      const now = li.getBoundingClientRect().top;
      if (prevTop === undefined) {
        li.animate([{ opacity: 0, transform: 'translateY(8px)' }, { opacity: 1, transform: 'none' }], { duration: 300, easing: 'ease-out' });
        return;
      }
      const dy = prevTop - now;
      if (dy) li.animate([{ transform: 'translateY(' + dy + 'px)' }, { transform: 'none' }], { duration: 450, easing: 'cubic-bezier(.2,.8,.2,1)' });
      const was = oldRanks.get(key);
      if (was && Number(li.dataset.rank) < was) li.classList.add('rank-up');
    });
  }

  root.HubBoard = { render };
})(window);

  function emit() {
    listeners.forEach((fn) => {
      try { fn(); } catch (e) { console.error(e); }
    });
  }

  function adminKey() {
    return U.store.get('sessionStorage', KEYS.adminKey, null) || U.store.get('localStorage', KEYS.adminKey, null) || '';
  }

  async function call(action, payload, opts) {
    const sent = Date.now();
    const body = Object.assign({}, payload || {});
    if (role !== 'participant' || (opts && opts.admin)) {
      const key = adminKey();
      if (key) body.adminKey = key;
    }
    const data = await B.call(action, body, opts);
    if (typeof data.serverTime === 'number') {
      const recv = Date.now();
      offset = data.serverTime - (sent + recv) / 2;
    }
    return data;
  }

  // ───────────── Local storage model ─────────────

  function localConfig() {
    return D.normalizeConfig(U.store.get('localStorage', KEYS.config, null));
  }

  function localLive() {
    const raw = U.store.get('localStorage', KEYS.live, null);
    const live = S.normalizeLive(raw);
    if (!raw) U.store.set('localStorage', KEYS.live, live);
    return live;
  }

  function draftConfig() {
    const draft = U.store.get('localStorage', KEYS.draft, null);
    if (draft && draft.config && Date.now() - (draft.at || 0) < 6 * 3600 * 1000) return D.normalizeConfig(draft.config);
    return null;
  }

  function localResults() {
    const all = U.store.get('localStorage', KEYS.results, {});
    return all && typeof all === 'object' ? all : {};
  }

  function rebuildLocal() {
    const config = (preview && draftConfig()) || localConfig();
    const live = localLive();
    pub = S.publicState(config, live, Date.now(), preview);
    pub.showdown = root.ShowdownCore ? root.ShowdownCore.publicView(localShowdown(), config.games['team-showdown'], Date.now()) : null;
    if (role !== 'participant') full = { config, live, showdown: localShowdown() };
  }

  function localShowdown() {
    const saved = U.store.get('localStorage', KEYS.showdown, null);
    if (saved && root.ShowdownCore) return saved;
    if (!root.ShowdownCore) return null;
    const cfg = localConfig().games['team-showdown'];
    return root.ShowdownCore.init(cfg, Date.now(), Math.random);
  }

  // ───────────── Shared model ─────────────

  async function pull() {
    if (role === 'participant') {
      const data = await call('state', {});
      pub = data.state;
    } else {
      const data = await call('adminState', {}, { admin: true });
      full = { config: data.config, live: data.live, showdown: data.showdown, results: data.results || null };
      const config = (preview && draftConfig()) || full.config;
      pub = S.publicState(config, full.live, now(), preview);
      pub.showdown = data.showdownPublic || null;
    }
    lastError = null;
  }

  function schedulePoll() {
    clearTimeout(pollTimer);
    if (mode !== 'shared') return;
    pollTimer = setTimeout(async () => {
      if (!document.hidden) {
        try {
          await pull();
          emit();
        } catch (e) {
          lastError = e;
          emit();
        }
      }
      schedulePoll();
    }, pollMs);
  }

  // ───────────── Initialisation ─────────────

  async function init(opts) {
    role = (opts && opts.role) || 'participant';
    preview = !!(opts && opts.preview);
    if (B.kind !== 'none') {
      const status = await B.check();
      if (status.connected && status.hub) mode = 'shared';
    }
    if (mode === 'shared') {
      try {
        if (role !== 'participant' || preview) {
          const who = await whoami();
          if (!who.isAdmin) {
            if (preview) preview = false;
            if (role !== 'participant') return { mode, isAdmin: false, who };
            role = 'participant';
          }
        }
        await pull().catch(pull); // one retry: the first request can be slow while Apps Script wakes up
      } catch (e) {
        lastError = e;
        if (!pub) {
          // The server answered the ping but not the state request: fall back to local play.
          mode = 'local';
        }
      }
    }
    if (mode === 'local') {
      rebuildLocal();
      root.addEventListener('storage', (e) => {
        if (e.key && e.key.indexOf('hub.') === 0) {
          rebuildLocal();
          emit();
        }
      });
    } else {
      schedulePoll();
      document.addEventListener('visibilitychange', () => {
        if (!document.hidden) refresh();
      });
    }
    return { mode, isAdmin: role !== 'participant' };
  }

  async function refresh() {
    if (mode === 'local') rebuildLocal();
    else {
      try {
        await pull();
      } catch (e) {
        lastError = e;
      }
      schedulePoll();
    }
    emit();
  }

  async function whoami(key) {
    if (mode === 'local' && B.kind === 'none') return { isAdmin: true, method: 'local' };
    const payload = {};
    if (key) payload.adminKey = key;
    const data = await call('whoami', payload, { admin: !key });
    return data;
  }

  // ───────────── Scores ─────────────

  async function startRun(game, payload) {
    if (preview) return { runId: 'preview', preview: true };
    if (mode === 'local') return { runId: 'local-' + U.uuid() };
    try {
      return await call('startRun', Object.assign({ game, deviceId: U.deviceId() }, payload));
    } catch (e) {
      return { runId: null, error: e };
    }
  }

  /**
   * payload: { runId, nickname, team, result, tiebreak }
   * Returns { ok, saved: 'shared'|'local'|'preview', score, rank, board, message }
   */
  async function submitRun(game, payload) {
    if (preview) return { ok: true, saved: 'preview', score: payload.localScore };
    if (mode === 'shared') {
      if (!payload.runId) return Object.assign(saveLocalRun(game, payload), { message: 'Your run wasn’t registered with the server, so the score was saved on this device only.' });
      try {
        const data = await call('submitRun', Object.assign({ game, deviceId: U.deviceId() }, payload));
        return Object.assign({ saved: 'shared' }, data);
      } catch (e) {
        return Object.assign(saveLocalRun(game, payload), { ok: false, error: e, message: e.message });
      }
    }
    return saveLocalRun(game, payload);
  }

  function saveLocalRun(game, payload) {
    const all = localResults();
    const live = localLive();
    const list = Array.isArray(all[game]) ? all[game] : [];
    const r = payload.result || {};
    const row = {
      id: U.uuid(),
      nickname: payload.nickname,
      team: payload.team || '',
      device: U.deviceId(),
      score: Number(payload.localScore) || 0,
      levels: Number(r.levelsCleared) || 0,
      timeMs: Number(r.totalMs || r.durationMs || r.ms) || 0,
      at: Date.now(),
      epoch: live.games[game].epoch,
      tiebreak: payload.tiebreak || '',
      detail: r,
    };
    list.push(row);
    all[game] = list.slice(-300);
    U.store.set('localStorage', KEYS.results, all);
    const board = localBoard(game);
    const mine = board.players.find((p) => p.you && p.nickname.toLowerCase() === String(payload.nickname).toLowerCase());
    return { ok: true, saved: 'local', score: row.score, rank: mine ? mine.rank : null, board };
  }

  function localBoard(game) {
    const live = localLive();
    const epoch = live.games[game].epoch;
    const rows = (localResults()[game] || []).filter((r) => r.epoch === epoch && !r.tiebreak);
    const players = S.rankPlayers(game, rows, U.deviceId());
    return { players, teams: S.rankTeams(players), saved: 'local' };
  }

  async function board(game) {
    if (mode === 'local' || preview) return localBoard(game);
    try {
      const data = await call('board', { game, deviceId: U.deviceId() });
      return { players: data.players, teams: data.teams || [], total: data.total, saved: 'shared' };
    } catch (e) {
      return Object.assign(localBoard(game), { error: e });
    }
  }

  /** How many attempts this player has used in the current epoch. */
  async function attemptsUsed(game, nickname) {
    const b = await board(game);
    const me = (b.players || []).find((p) => p.you && p.nickname.toLowerCase() === String(nickname).toLowerCase());
    return me ? me.attempts : 0;
  }

  async function redeemerContent() {
    if (root.REDEEMER_CONTENT) return root.REDEEMER_CONTENT;
    const data = await call('content', { game: 'redeemers-challenge', preview }, { admin: preview });
    root.REDEEMER_CONTENT = data.content;
    return data.content;
  }

  // ───────────── Team Showdown (team devices) ─────────────

  const showdown = {
    token() {
      const t = U.store.get('localStorage', KEYS.tokens, null);
      return t && t.token ? t : null;
    },
    async join(code, team) {
      const data = await call('showdownJoin', { code, team, deviceId: U.deviceId() });
      U.store.set('localStorage', KEYS.tokens, { token: data.token, team: data.team, name: data.name });
      return data;
    },
    leave() {
      U.store.remove('localStorage', KEYS.tokens);
    },
    async buzz() {
      const t = showdown.token();
      if (!t) throw new B.BackendError('NO_TEAM', 'Join a team first.');
      const data = await call('buzz', { token: t.token });
      if (data.state) pub.showdown = data.state;
      emit();
      return data;
    },
    async wager(amount, answer) {
      const t = showdown.token();
      if (!t) throw new B.BackendError('NO_TEAM', 'Join a team first.');
      const payload = { token: t.token };
      if (amount != null) payload.amount = amount;
      if (answer != null) payload.answer = answer;
      const data = await call('wager', payload);
      if (data.state) pub.showdown = data.state;
      emit();
      return data;
    },
  };

  // ───────────── Admin ─────────────

  function saveDraft(config) {
    U.store.set('localStorage', KEYS.draft, { config, at: Date.now() });
  }

  const admin = {
    setKey(key, remember) {
      U.store.remove('localStorage', KEYS.adminKey);
      U.store.remove('sessionStorage', KEYS.adminKey);
      if (key) U.store.set(remember ? 'localStorage' : 'sessionStorage', KEYS.adminKey, key);
    },
    hasKey: () => !!adminKey(),
    full: () => full,
    async saveConfig(config) {
      const clean = D.normalizeConfig(config);
      // Visibility is changed only through controls, so a stale draft can't undo a show/hide.
      D.GAME_IDS.forEach((id) => {
        clean.games[id].visible = full.config.games[id].visible;
        clean.games[id].enabled = full.config.games[id].enabled;
      });
      if (mode === 'local') {
        U.store.set('localStorage', KEYS.config, clean);
        rebuildLocal();
      } else {
        const data = await call('saveConfig', { config: clean }, { admin: true });
        full.config = data.config;
        full.live = data.live;
      }
      emit();
      return full.config;
    },
    async restoreDefaults() {
      if (mode === 'local') return admin.saveConfig(D.defaults());
      // The server holds the default questions; the admin page never needs them.
      const data = await call('saveConfig', { defaults: true }, { admin: true });
      full.config = data.config;
      full.live = data.live;
      emit();
      return full.config;
    },
    async control(game, op, args) {
      if (mode === 'local') {
        const config = localConfig();
        const out = S.control(config, localLive(), game, op, args, Date.now());
        if (out.error) throw new B.BackendError('BAD_CONTROL', out.error);
        U.store.set('localStorage', KEYS.config, out.config);
        U.store.set('localStorage', KEYS.live, out.live);
        if (game === 'team-showdown' && op === 'reset') admin.showdownLocalReset();
        rebuildLocal();
      } else {
        const data = await call('control', { game, op, args }, { admin: true });
        full.config = data.config;
        full.live = data.live;
        if (data.showdown) full.showdown = data.showdown;
        pub = S.publicState(full.config, full.live, now(), false);
      }
      emit();
    },
    showdownLocalReset() {
      const cfg = localConfig().games['team-showdown'];
      U.store.set('localStorage', KEYS.showdown, root.ShowdownCore.init(cfg, Date.now(), Math.random));
    },
    async showdown(op, args) {
      if (mode === 'local') {
        const cfg = localConfig().games['team-showdown'];
        const out = root.ShowdownCore.reduce(localShowdown(), Object.assign({ type: op }, args || {}), cfg, Date.now(), Math.random);
        if (out.error) throw new B.BackendError('BAD_ACTION', out.error);
        U.store.set('localStorage', KEYS.showdown, out.state);
        rebuildLocal();
        emit();
        return out.state;
      }
      const data = await call('showdownOp', { op, args: args || {} }, { admin: true });
      full.showdown = data.showdown;
      emit();
      return data.showdown;
    },
    async results(game) {
      if (mode === 'local') {
        const live = localLive();
        const rows = (localResults()[game] || []).map((r) => Object.assign({ status: 'ok', current: r.epoch === live.games[game].epoch }, r));
        return { rows, epoch: live.games[game].epoch };
      }
      return call('results', { game }, { admin: true });
    },
    async adjust(game, id, score) {
      if (mode === 'local') {
        const all = localResults();
        const row = (all[game] || []).find((r) => r.id === id);
        if (!row) throw new B.BackendError('NOT_FOUND', 'That score no longer exists.');
        row.score = score;
        row.status = 'adjusted';
        U.store.set('localStorage', KEYS.results, all);
        emit();
        return;
      }
      await call('adjustScore', { game, id, score }, { admin: true });
    },
    async resetSession() {
      if (mode === 'local') {
        for (const id of D.GAME_IDS) await admin.control(id, 'reset', {});
        U.store.remove('localStorage', KEYS.results);
        admin.showdownLocalReset();
        rebuildLocal();
        emit();
        return;
      }
      const data = await call('resetSession', {}, { admin: true });
      full.live = data.live;
      full.showdown = data.showdown;
      emit();
    },
    saveDraft,
    clearDraft: () => U.store.remove('localStorage', KEYS.draft),
  };

  root.HubStore = {
    init,
    refresh,
    whoami,
    get mode() { return mode; },
    get preview() { return preview; },
    get lastError() { return lastError; },
    state: () => pub,
    game: (id) => (pub ? pub.games.find((g) => g.id === id) || null : null),
    now,
    subscribe(fn) {
      listeners.push(fn);
      return () => {
        const i = listeners.indexOf(fn);
        if (i >= 0) listeners.splice(i, 1);
      };
    },
    setPollInterval(ms) {
      if (ms === pollMs) return;
      pollMs = ms;
      schedulePoll();
    },
    startRun,
    submitRun,
    board,
    attemptsUsed,
    redeemerContent,
    showdown,
    admin,
    KEYS,
  };
})(window);


/* ── games/showdown-host.js ── */
/*
 * Team Showdown — the host screen for the projector, with the facilitator's control dock.
 * Used by the admin dashboard's presenter view. It works in both modes:
 *   local  — the laptop runs the game; teams shout or the facilitator taps the team that buzzed
 *   shared — team phones buzz through the Apps Script server; the facilitator adjudicates
 */
(function (root) {
  'use strict';

  const U = root.HubUtil;
  const Core = root.ShowdownCore;

  function mount(container, opts) {
    const store = opts.store;
    const el = (tag, cls, text) => U.el(tag, cls, text);
    let destroyed = false;
    let timer = null;
    let lastSeq = -1;
    let timeoutSent = -1;
    let busy = false;

    const wrap = el('div', 'sd-host');
    const top = el('div', 'sd-top');
    const stageEl = el('div', 'sd-stage');
    const board = el('ol', 'sd-board');
    const dock = el('div', 'sd-dock');
    dock.setAttribute('aria-label', 'Facilitator controls');
    wrap.append(top, stageEl, board, dock);
    container.appendChild(wrap);

    function cfg() {
      return store.admin.full().config.games['team-showdown'];
    }
    function state() {
      return store.admin.full().showdown;
    }
    function view() {
      return Core.publicView(state(), cfg(), store.now(), true);
    }

    async function act(op, args) {
      if (busy) return;
      busy = true;
      try {
        await store.admin.showdown(op, args);
        if (op === 'judge') root.HubSfx.play(args.correct ? 'correct' : 'wrong');
        if (op === 'buzz' || op === 'override') root.HubSfx.play('buzz');
      } catch (e) {
        U.toast(e.message || 'That didn’t work.');
      } finally {
        busy = false;
      }
      render();
    }

    function teamName(v, i) {
      return v.teams[i] ? v.teams[i].name : 'Team ' + (i + 1);
    }

    // ---- Rendering ----
    function render() {
      if (destroyed) return;
      const v = view();
      if (!v) return;
      const changed = v.seq !== lastSeq;
      renderTop(v);
      if (changed) {
        renderStage(v);
        renderBoard(v);
        renderDock(v);
        if (v.phase === 'finished' && lastSeq !== -1 && v.winners.length === 1) {
          root.HubSfx.play('win');
          root.HubConfetti.burst({ count: 200 });
        }
        lastSeq = v.seq;
      } else {
        updateTimers(v);
      }
      // The host enforces the question clock in both modes.
      if ((v.phase === 'question' || v.phase === 'steal') && v.timeLeft === 0 && !v.paused && timeoutSent !== v.seq) {
        timeoutSent = v.seq;
        act('timeout');
      }
    }

    function renderTop(v) {
      top.textContent = '';
      const left = el('div', 'sd-round');
      if (v.tiebreak) left.append(el('span', 'sd-pill hot', 'Tie-breaker'), el('strong', null, 'Sudden death'));
      else if (v.round) {
        left.append(el('span', 'sd-pill', 'Round ' + v.roundNumber + ' of ' + v.roundCount), el('strong', null, v.round.title));
        if (v.round.double) left.appendChild(el('span', 'sd-pill hot', 'Double points'));
      } else left.appendChild(el('strong', null, { lobby: 'Team Showdown', rules: 'How to play', wager: 'Final Wager', 'wager-question': 'Final Wager', 'wager-reveal': 'Final Wager', 'wager-answer': 'Final Wager', finished: 'Final scores' }[v.phase] || 'Team Showdown'));
      const right = el('div', 'sd-clock');
      right.dataset.role = 'clock';
      top.append(left, right);
      updateTimers(v);
    }

    function updateTimers(v) {
      const clock = top.querySelector('[data-role="clock"]');
      if (clock) {
        clock.textContent = v.timeLeft == null ? '' : v.paused ? 'Paused' : String(Math.ceil(v.timeLeft / 1000));
        clock.classList.toggle('low', v.timeLeft != null && v.timeLeft <= 5000 && !v.paused);
      }
      board.querySelectorAll('[data-lock]').forEach((n) => {
        const i = Number(n.dataset.lock);
        const ms = Math.max(0, (v.teams[i] && v.teams[i].lockMs) || 0);
        n.textContent = ms > 0 ? 'Locked ' + Math.ceil(ms / 1000) + 's' : '';
      });
    }

    function renderStage(v) {
      stageEl.textContent = '';
      stageEl.className = 'sd-stage phase-' + v.phase;
      const s = v.settings;
      if (v.phase === 'lobby') {
        stageEl.append(el('h2', 'sd-title', 'Team Showdown'), el('p', 'sd-sub', 'Buzzers, steals, streaks and a final wager.'));
        if (store.mode === 'shared') {
          const codes = el('div', 'sd-codes');
          v.teams.forEach((t, i) => {
            const c = el('div', 'sd-code');
            c.append(el('span', null, t.name), el('strong', null, v.host.joinCodes[i]));
            codes.appendChild(c);
          });
          stageEl.append(el('p', 'sd-sub', 'Team phones: open the game, choose Team Showdown, and enter your team’s code.'), codes);
        } else {
          stageEl.appendChild(el('p', 'sd-sub', 'Teams shout their name to buzz in; the facilitator taps the team that was first.'));
        }
        return;
      }
      if (v.phase === 'rules') {
        stageEl.appendChild(el('h2', 'sd-title', 'The rules in one minute'));
        const list = el('ol', 'sd-rules');
        [
          'Buzz in when you know the answer. The first team to buzz answers.',
          'Right answer: points. Wrong answer: −' + s.wrongPenalty + ', and the other teams can steal for ' + s.stealPct + '% of the points.',
          s.streakLength + ' correct answers in a row: +' + s.streakBonus + ' streak bonus on each one after that.',
          'A wrong answer or an early buzz locks your buzzer for ' + s.lockoutSec + ' seconds.',
          'Name Five: 30 seconds per team. Repeats of another team’s answers don’t count.',
          s.wagerEnabled ? 'Final Wager: secretly bet up to ' + s.maxWager + ' of your points on one last question.' : 'The highest score at the end wins.',
        ].forEach((t) => list.appendChild(el('li', null, t)));
        stageEl.appendChild(list);
        return;
      }
      if (v.phase === 'round-intro') {
        stageEl.append(el('p', 'sd-kicker', 'Round ' + v.roundNumber), el('h2', 'sd-title', v.round.title), el('p', 'sd-sub', v.round.intro));
        const meta = v.round.type === 'judged' ? v.round.points + ' points per valid answer' + (v.round.bonus ? ', +' + v.round.bonus + ' for all five' : '') : v.round.points + ' points · ' + v.round.timeSec + ' seconds';
        stageEl.appendChild(el('p', 'sd-meta', meta + (v.round.double ? ' · DOUBLE POINTS' : '')));
        return;
      }
      if (v.phase === 'wager') {
        stageEl.append(el('h2', 'sd-title', 'Final Wager'), el('p', 'sd-sub', 'Each team secretly bets part of its score on one last question (maximum ' + s.maxWager + ').'));
        const row = el('div', 'sd-wager-row');
        v.teams.forEach((t, i) => {
          const c = el('div', 'sd-wager' + (v.wager.submitted[i] ? ' done' : ''));
          c.append(el('span', null, t.name), el('strong', null, v.wager.submitted[i] ? 'Wager locked' : 'Deciding…'));
          row.appendChild(c);
        });
        stageEl.appendChild(row);
        return;
      }
      if (v.phase === 'finished') {
        if (v.winners.length === 1) stageEl.append(el('p', 'sd-kicker', v.tiebreak ? 'Tie broken!' : 'And the winner is…'), el('h2', 'sd-title sd-winner', teamName(v, v.winners[0])));
        else if (v.winners.length > 1) stageEl.append(el('p', 'sd-kicker', 'It’s a tie!'), el('h2', 'sd-title', v.winners.map((i) => teamName(v, i)).join(' & ')), el('p', 'sd-sub', 'Run a sudden-death tie-breaker, or share the glory.'));
        const closing = cfg().closing;
        if (closing) stageEl.appendChild(el('p', 'sd-sub', closing));
        return;
      }
      // Question-like phases
      if (v.question) {
        const qbox = el('div', 'sd-question');
        if (!v.tiebreak && v.round) qbox.appendChild(el('p', 'sd-kicker', 'Question ' + v.question.number + ' of ' + v.question.total));
        qbox.appendChild(el('h2', 'sd-prompt', v.question.prompt));
        if (v.question.display) qbox.appendChild(el('p', 'sd-display', v.question.display));
        stageEl.appendChild(qbox);
      }
      if (v.phase === 'answering') {
        const b = el('div', 'sd-banner answering');
        b.append(el('strong', null, teamName(v, v.answering) + (v.stealing ? ' is stealing!' : ' buzzed first!')));
        if (v.buzzes.length > 1) b.appendChild(el('span', null, v.buzzes.slice(1).map((x) => teamName(v, x.team) + ' +' + (x.after / 1000).toFixed(2) + 's').join(' · ')));
        stageEl.appendChild(b);
      }
      if (v.phase === 'steal') stageEl.appendChild(el('div', 'sd-banner steal', 'Steal! Other teams can buzz for ' + s.stealPct + '% of the points.'));
      if (v.phase === 'judged' && v.judged) {
        const j = v.judged;
        const b = el('div', 'sd-banner answering');
        const turnTeam = j.turnTeam;
        b.append(el('strong', null, (turnTeam != null ? teamName(v, turnTeam) : '') + ': name five!'));

          if (v.phase === 'wager-answer') {
            const d = v.wager.deltas[i];

    function renderBoard(v) {
      const rows = v.teams.map((t, i) => ({ i, t })).sort((a, b) => b.t.score - a.t.score || a.i - b.i);
      const before = new Map();
      Array.from(board.children).forEach((li) => before.set(li.dataset.key, li.getBoundingClientRect().left));
      board.textContent = '';
      let rank = 0;
      rows.forEach((r, k) => {
        if (k === 0 || r.t.score !== rows[k - 1].t.score) rank = k + 1;
        const li = el('li', 'sd-team');
        li.dataset.key = String(r.i);
        if (v.answering === r.i) li.classList.add('answering');
        if (v.attempted.indexOf(r.i) >= 0) li.classList.add('out');
        if (v.winners.indexOf(r.i) >= 0 && v.phase === 'finished') li.classList.add('winner');
        li.append(el('span', 'sd-rank', String(rank)), el('span', 'sd-name', r.t.name), el('span', 'sd-score', String(r.t.score)));

        if (r.t.streak >= 2) meta.appendChild(el('span', 'sd-streak', 'Streak ' + r.t.streak));
        const lock = el('span', 'sd-lock');
        lock.dataset.lock = String(r.i);
        meta.appendChild(lock);

        board.appendChild(li);

      if (U.reducedMotion()) return;
      Array.from(board.children).forEach((li) => {
        const was = before.get(li.dataset.key);
        if (was === undefined) return;
        const dx = was - li.getBoundingClientRect().left;
        if (dx) li.animate([{ transform: 'translateX(' + dx + 'px)' }, { transform: 'none' }], { duration: 500, easing: 'cubic-bezier(.2,.8,.2,1)' });

    function btn(text, cls, fn, key) {

    function renderDock(v) {
      dock.textContent = '';

      const side = el('div', 'sd-dock-side');
      const p = v.phase;
      if (p === 'lobby') main.appendChild(btn('Start the game', 'btn-primary', () => act('start'), 'N'));
      if (p === 'rules') main.appendChild(btn('First round', 'btn-primary', () => act('next'), 'N'));
      if (p === 'round-intro') main.appendChild(btn('Show the first question', 'btn-primary', () => act('next'), 'N'));
      if (p === 'question' || p === 'steal') {
        const eligible = v.tiebreak ? v.tiebreak.teams : v.teams.map((_, i) => i);
        eligible.filter((i) => v.attempted.indexOf(i) < 0).forEach((i) => main.appendChild(btn(teamName(v, i) + ' buzzed', 'btn-team', () => act('buzz', { team: i }), String(i + 1))));
        main.appendChild(btn('Reveal answer', 'btn-ghost', () => act('reveal'), 'R'));
      }
      if (p === 'answering') {
        main.append(btn('Correct', 'btn-ok', () => act('judge', { correct: true }), 'C'), btn('Wrong', 'btn-no', () => act('judge', { correct: false }), 'X'));
        const others = (v.tiebreak ? v.tiebreak.teams : v.teams.map((_, i) => i)).filter((i) => i !== v.answering && v.attempted.indexOf(i) < 0);
        others.forEach((i) => main.appendChild(btn('Give to ' + teamName(v, i), 'btn-ghost', () => act('override', { team: i }), String(i + 1))));
      }
      if (p === 'revealed') main.appendChild(btn(v.host.step + 1 >= v.host.planLength && !v.tiebreak ? 'Continue to the finale' : 'Next question', 'btn-primary', () => act('next'), 'N'));
      if (p === 'judged') {
        main.append(btn('+1 valid', 'btn-ok', () => act('judgedMark', { delta: 1 }), '+'), btn('−1', 'btn-ghost', () => act('judgedMark', { delta: -1 }), '-'));
        const last = v.judged.turn + 1 >= v.judged.order.length;
        main.appendChild(btn(last ? 'Score this question' : 'Next team', 'btn-primary', () => act('judgedNext'), 'N'));
      }
      if (p === 'wager') {
        v.teams.forEach((t, i) => {
          const f = el('label', 'sd-wager-input');
          f.appendChild(el('span', null, t.name + ' (max ' + v.host.maxWager[i] + ')'));
          const input = el('input', 'input');
          input.type = 'number';
          input.min = '0';
          input.max = String(v.host.maxWager[i]);
          input.inputMode = 'numeric';
          if (v.host.wager.amounts[i] != null) input.value = String(v.host.wager.amounts[i]);
          input.addEventListener('change', () => act('setWager', { team: i, amount: Number(input.value) || 0 }));
          f.appendChild(input);
          main.appendChild(f);
        });
        main.appendChild(btn('Lock wagers & show the question', 'btn-primary', () => act('next'), 'N'));
      }
      if (p === 'wager-question' || p === 'wager-reveal') {
        v.teams.forEach((t, i) => {
          const box = el('div', 'sd-mark');
          const ans = v.host.wager.answers[i];
          box.appendChild(el('span', null, t.name + (ans ? ': “' + ans + '”' : '')));
          const mark = v.host.wager.marks[i];
          const yes = btn('✓', mark === true ? 'btn-ok' : 'btn-ghost', () => act('wagerMark', { team: i, correct: true }));
          const no = btn('✗', mark === false ? 'btn-no' : 'btn-ghost', () => act('wagerMark', { team: i, correct: false }));
          yes.setAttribute('aria-label', t.name + ' correct');
          no.setAttribute('aria-label', t.name + ' wrong');
          box.append(yes, no);

        });
        main.appendChild(btn(p === 'wager-question' ? 'Reveal the wagers' : 'Reveal the answer', 'btn-primary', () => act('next'), 'N'));
      }
      if (p === 'wager-answer') main.appendChild(btn('Final results', 'btn-primary', () => act('next'), 'N'));
      if (p === 'finished') {
        if (v.winners.length > 1 && !v.tiebreak) main.appendChild(btn('Run a tie-breaker', 'btn-primary', () => act('tiebreak')));
        main.appendChild(btn('Reset for a new game', 'btn-ghost', () => {
          if (root.confirm('Reset Team Showdown? Scores go back to zero.')) act('reset');
        }));
      }

      if (v.host.answer && p !== 'lobby' && p !== 'rules' && p !== 'finished' && !v.answer) {
        // This bar is on the projector too, so the answer stays hidden until the host peeks.
        const a = el('div', 'sd-host-answer');
        const peek = U.button('Peek at the answer', 'btn btn-ghost btn-sm', () => {
          a.textContent = '';
          a.appendChild(el('strong', null, v.host.answer.text));
          if (v.host.answer.accept.length) a.appendChild(el('span', 'muted', ' · also: ' + v.host.answer.accept.join(', ')));
          setTimeout(() => {
            if (a.isConnected) {
              a.textContent = '';
              a.appendChild(peek);
            }
          }, 4000);
        });
        peek.setAttribute('aria-keyshortcuts', 'A');
        peek.appendChild(el('kbd', null, 'A'));
        a.appendChild(peek);
        side.appendChild(a);
      }
      if (p !== 'lobby') {
        if (v.timeLeft != null) side.appendChild(btn(v.paused ? 'Resume clock' : 'Pause clock', 'btn-ghost', () => act(v.paused ? 'resume' : 'pause'), 'P'));
        const adj = el('details', 'sd-adjust');
        adj.appendChild(el('summary', null, 'Adjust scores'));
        v.teams.forEach((t, i) => {
          const row = el('div', 'sd-adjust-row');
          row.append(el('span', null, t.name), btn('−10', 'btn-ghost', () => act('adjust', { team: i, delta: -10 })), btn('+10', 'btn-ghost', () => act('adjust', { team: i, delta: 10 })));
          adj.appendChild(row);
        });
        side.appendChild(adj);
        if (p !== 'finished') side.appendChild(btn('End game', 'btn-ghost', () => {
          if (root.confirm('End Team Showdown now and show the final scores?')) act('end');
        }));
      }
      if (store.mode === 'shared') side.appendChild(el('span', 'muted sd-devices', U.plural(v.host.devices, 'team phone') + ' joined'));
      dock.append(main, side);
    }

    function onKey(e) {
      if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.ctrlKey || e.metaKey || e.altKey) return;
      const buttons = Array.from(dock.querySelectorAll('button[aria-keyshortcuts]'));
      const k = e.key.toUpperCase();
      const hit = buttons.find((b) => b.getAttribute('aria-keyshortcuts').toUpperCase() === k || (k === 'ARROWRIGHT' && b.getAttribute('aria-keyshortcuts') === 'N'));
      if (hit) {
        e.preventDefault();
        hit.click();
      }
    }

    root.addEventListener('keydown', onKey);
    const unsub = store.subscribe(render);
    timer = setInterval(render, 250);
    if (store.mode === 'shared') store.setPollInterval(1000);
    render();

    return {
      destroy() {
        destroyed = true;
        clearInterval(timer);
        unsub();
        root.removeEventListener('keydown', onKey);
        if (store.mode === 'shared') store.setPollInterval(4000);
        wrap.remove();
      },
    };
  }

  root.ShowdownHost = { mount };
})(window);

/*
 * Admin dashboard: session settings, game visibility, facilitator controls, scores and the
 * projector view.
 *
 * Security: in shared mode every action here is a request that the Apps Script server
 * authorises (Google account allowlist or admin key). Nothing on this page is trusted by
 * the server. In local mode the dashboard only changes this browser's own storage.
 */
(function (root) {
  'use strict';

  const U = root.HubUtil;
  const D = root.HubDefaults;
  const S = root.HubSession;
  const Store = root.HubStore;
  const $ = U.$;
  const el = U.el;

  const isGas = !!(root.google && root.google.script && root.google.script.run);
  const appUrl = document.body.dataset.appUrl || '';

    'gleaners-rush': { kind: 'Arcade game', icon: 'i-stalk', arcade: true },
    'redeemers-challenge': { kind: 'Ruth 4 quiz', icon: 'i-book' },
    'road-to-bethlehem': { kind: 'Puzzle game', icon: 'i-road', arcade: true },
    'team-showdown': { kind: 'Team game show', icon: 'i-buzz' },
  };
  const STATUS_LABEL = { ready: 'Ready', running: 'Running', paused: 'Paused', ended: 'Ended' };

  let draft = null;
  let dirty = false;
  let tab = 'session';
  let configuring = null;
  let controlGame = 'gleaners-rush';
  let scoresGame = 'gleaners-rush';
  let presenter = null; // { kind, destroy }
  let who = null;
  let ticker = null;

  const clone = (v) => JSON.parse(JSON.stringify(v));
  const full = () => Store.admin.full();
  const title = (id) => (draft ? draft.games[id].title : D.defaults().games[id].title);

  // ───────────── URLs ─────────────

  function participantUrl(params) {
    if (isGas && appUrl) return appUrl + (params ? '?' + params : '');
    const u = new URL('index.html', root.location.href);
    if (params) u.search = params;
    return u.href;
  }

  function previewUrl(game) {
    if (isGas && appUrl) return participantUrl('preview=1' + (game ? '&game=' + game : ''));
    return participantUrl('preview=1') + (game ? '#/play/' + game : '');

  function openWindow(url) {

  // ───────────── Confirmation dialog ─────────────

  function confirmAction(opts) {
    return new Promise((resolve) => {
      const dialog = $('confirmDialog');
      $('confirmTitle').textContent = opts.title || 'Are you sure?';
      $('confirmText').textContent = opts.text || '';
      $('confirmOk').textContent = opts.ok || 'Confirm';
      const typed = !!opts.word;
      $('confirmTyped').hidden = !typed;
      $('confirmWord').textContent = opts.word || '';
      $('confirmInput').value = '';
      function onClose() {
        dialog.removeEventListener('close', onClose);
        const ok = dialog.returnValue === 'ok' && (!typed || $('confirmInput').value.trim().toUpperCase() === opts.word);
        if (dialog.returnValue === 'ok' && !ok) U.toast('Not confirmed: the word didn’t match.');
        resolve(ok);
      }
      dialog.addEventListener('close', onClose);
      dialog.returnValue = '';
      if (typeof dialog.showModal === 'function') dialog.showModal();
      else resolve(root.confirm((opts.title || '') + '\n' + (opts.text || '')));
      if (typed) $('confirmInput').focus();
    });
  }

  async function run(fn, success) {
    try {
      await fn();
      if (success) U.toast(success, 2200);
      return true;
    } catch (e) {
      U.toast(e.message || 'That didn’t work.', 4000);
      return false;
    }
  }

  // ───────────── Tabs & saving ─────────────

  function setTab(name) {
    tab = name;
    document.querySelectorAll('.admin-tab').forEach((b) => {
      if (b.dataset.tab === name) b.setAttribute('aria-current', 'page');
      else b.removeAttribute('aria-current');

    document.querySelectorAll('.admin-section').forEach((s) => { s.hidden = s.id !== 'tab-' + name; });

    root.scrollTo(0, 0);
  }

    if (tab === 'scores' && force) renderScores();
    if (tab === 'present' && force) renderPresent();
    if (tab === 'access' && force) renderAccess();

  }

  $('saveBtn').addEventListener('click', async () => {

    if (opts && opts.placeholder) input.placeholder = opts.placeholder;

  function switchField(label, checked, onChange, help) {

  function schemaField(f, value, onChange) {
    if (f.type === 'bool') return switchField(f.label, value, onChange, f.help);
    const wrap = el('label', 'admin-field');
    wrap.appendChild(el('span', 'field-label', f.label));
    if (f.type === 'number') {
      const input = el('input', 'input');
      input.type = 'number';
      input.min = String(f.min);
      input.max = String(f.max);
      input.step = String(f.step || 1);

        const n = Number(input.value);
        const clean = isFinite(n) ? U.clamp(n, f.min, f.max) : f.def;
        input.value = String(clean);
        onChange(clean);
      });

      const sel = el('select', 'input');
      f.options.forEach(([v, l]) => {
        const o = el('option', null, l);
        o.value = v;
        sel.appendChild(o);
      });
      sel.value = value;
      sel.addEventListener('change', () => onChange(sel.value));
      wrap.appendChild(sel);
    } else if (f.type === 'list') {
      const box = el('div', 'admin-list-inputs');

  }

  // ───────────── Status ─────────────

  function statusOf(id) {
