.muted { color: var(--ink-soft); font-weight: 400; }

/* ───────── Top bar ───────── */

.topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  max-width: 1040px;
  margin: 0 auto;
  padding: max(12px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
}

.brand {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  padding: 6px 8px 6px 4px;
  border: 0;
  border-radius: 10px;
  background: none;
  cursor: pointer;
  font-family: var(--font-display);
  font-weight: 650;
  font-size: 1rem;
  min-width: 0;
}
.brand-mark { width: 18px; height: 34px; color: var(--gold); flex: none; }
.brand-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.topbar-actions { display: flex; align-items: center; gap: 6px; flex: none; }

.score-chip {
  padding: 6px 12px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 0.85rem;
  color: var(--ink-soft);
  font-variant-numeric: tabular-nums;
}
.score-chip strong { color: var(--ink); font-size: 1rem; }

.icon-btn {
  display: inline-grid;
  place-items: center;
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 1px solid transparent;
  background: none;
  cursor: pointer;
  color: var(--ink-soft);
}
.icon-btn:hover { background: var(--surface); border-color: var(--line); color: var(--ink); }
.icon-btn svg { width: 22px; height: 22px; }

/* ───────── Layout ───────── */

main {
  max-width: 1040px;
  margin: 0 auto;
  padding: 8px max(16px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
}

.screen { animation: rise 0.35s ease both; }
.screen-narrow { max-width: 560px; margin: 0 auto; }

@keyframes rise {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: none; }
}

.card {
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
}

.eyebrow {
  margin: 0 0 6px;
  font-size: 0.78rem;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--gold-ink);
}

.display, .display-sm {
  font-family: var(--font-display);
  font-weight: 650;
  letter-spacing: -0.01em;
  line-height: 1.12;
  margin: 0 0 12px;
  text-wrap: balance;
}
.display { font-size: clamp(2.1rem, 5vw, 3.4rem); }
.display-sm { font-size: clamp(1.6rem, 3.4vw, 2.3rem); }

.lead { font-size: 1.08rem; color: var(--ink-soft); margin: 0 0 20px; }

/* ───────── Buttons ───────── */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 48px;
  padding: 10px 22px;
  border-radius: 999px;
  border: 1.5px solid transparent;
  font-weight: 600;
  font-size: 1rem;
  cursor: pointer;
  text-decoration: none;
  transition: transform 0.12s ease, background-color 0.15s ease, border-color 0.15s ease;
}
.btn:active { transform: scale(0.98); }
.btn svg { width: 20px; height: 20px; }
.btn-primary { background: var(--primary); color: var(--primary-ink); }
.btn-primary:hover { filter: brightness(1.08); }
.btn-ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn-ghost:hover { background: var(--surface); border-color: var(--gold); }
.btn-link {
  background: none;
  border: 0;
  color: var(--gold-ink);
  text-decoration: underline;
  text-underline-offset: 3px;
  padding: 8px 4px;
  min-height: 44px;
}
.btn-xl { min-height: 60px; padding: 14px 44px; font-size: 1.15rem; }

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  justify-content: center;
  margin-top: 28px;
}

/* ───────── Welcome ───────── */

.screen-welcome { text-align: center; max-width: 720px; margin: 0 auto; padding-top: 4px; }

.hero-art { margin: 0 auto 8px; max-width: 360px; }
.gate-art { width: 100%; height: auto; display: block; }
.art-sun { fill: var(--gold-soft); opacity: 0.7; }
.art-line path { fill: var(--bg); stroke: var(--ink); stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; opacity: 0.78; }
.art-line .art-faint { stroke-width: 1.2; opacity: 0.32; }
.art-grain { color: var(--gold); }

.tagline {
  font-family: var(--font-display);
  font-style: italic;
  font-size: 1.3rem;
  color: var(--gold-ink);
  margin: 0 0 12px;
}
.intro { color: var(--ink-soft); max-width: 36em; margin: 0 auto 24px; font-size: 1.05rem; }

.mode-picker {
  border: 0;
  margin: 0 0 24px;
  padding: 0;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  text-align: left;
}
.mode-picker legend {
  grid-column: 1 / -1;
  padding: 0;
  margin: 0 auto 10px;
  font-weight: 600;
  text-align: center;
  width: 100%;
}
.mode-card { position: relative; cursor: pointer; display: block; }
.mode-card input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; }
.mode-card-body {
  display: grid;
  grid-template-columns: auto 1fr;
  column-gap: 12px;
  row-gap: 2px;
  height: 100%;
  padding: 16px;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  transition: border-color 0.15s ease, box-shadow 0.15s ease, background-color 0.15s ease;
}
.mode-icon { grid-row: 1 / span 2; width: 30px; height: 30px; color: var(--gold); margin-top: 2px; }
.mode-title { font-weight: 700; font-size: 1.05rem; }
.mode-desc { color: var(--ink-soft); font-size: 0.92rem; line-height: 1.4; }
.mode-card:hover .mode-card-body { border-color: var(--gold); }
.mode-card input:checked + .mode-card-body {
  border-color: var(--gold);
  background: var(--surface-2);
  box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 25%, transparent);
}
.mode-card input:focus-visible + .mode-card-body { outline: 3px solid var(--focus); outline-offset: 3px; }

.backend-status { min-height: 1.5em; margin: 16px 0 0; font-size: 0.9rem; color: var(--ink-soft); }
.backend-status .dot {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  margin-right: 6px;
  vertical-align: middle;
  background: var(--ink-soft);
}
.backend-status .dot.ok { background: var(--olive); }

/* ───────── Forms ───────── */

.form-card { padding: 22px; }
.field-label { display: block; font-weight: 600; margin: 0 0 6px; }
.input {
  width: 100%;
  min-height: 52px;
  padding: 12px 14px;
  border: 1.5px solid var(--line);
  border-radius: var(--radius-sm);
  background: var(--bg-glow);
  font-size: 1.05rem;
}
.input:focus { border-color: var(--gold); outline: none; box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 30%, transparent); }
.input[aria-invalid='true'] { border-color: var(--clay); }
textarea.input { resize: vertical; min-height: 64px; line-height: 1.4; }
.input-code { text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.field-help { font-size: 0.85rem; color: var(--ink-soft); margin: 6px 0 14px; }
.field-error { min-height: 1.4em; margin: 6px 0 10px; font-size: 0.9rem; color: var(--clay-ink); font-weight: 500; }
.field-error:empty { min-height: 0.6em; }
.form-actions { display: flex; justify-content: space-between; gap: 12px; margin-top: 8px; }

.team-inputs { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.team-inputs li { display: flex; gap: 8px; align-items: center; }
.team-inputs .team-num {
  flex: none;
  width: 32px; height: 32px;
  border-radius: 50%;
  display: grid; place-items: center;
  background: var(--surface-2);
  color: var(--gold-ink);
  font-weight: 700;
  font-size: 0.9rem;
}
.team-inputs .remove {
  flex: none;
  width: 44px; height: 44px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: none;
  cursor: pointer;
  color: var(--ink-soft);
}
.team-inputs .remove svg { width: 18px; height: 18px; }
.btn-add { margin-top: 6px; }

.check { display: flex; align-items: center; gap: 10px; min-height: 44px; margin: 6px 0; cursor: pointer; font-weight: 500; }
.check input { width: 22px; height: 22px; accent-color: var(--gold); }

/* ───────── Question ───────── */

.screen-question { max-width: 920px; margin: 0 auto; }

.q-head { display: flex; align-items: center; gap: 16px; margin-bottom: 18px; }
.progress { flex: 1; min-width: 0; }
.progress-label { display: block; font-size: 0.9rem; font-weight: 600; color: var(--ink-soft); margin-bottom: 8px; }
.progress-track { height: 8px; border-radius: 999px; background: var(--line); overflow: hidden; }
.progress-fill { height: 100%; width: 0; border-radius: inherit; background: var(--gold); transition: width 0.4s ease; }

.timer { position: relative; width: 64px; height: 64px; flex: none; }
.timer svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.timer-track { fill: var(--surface); stroke: var(--line); stroke-width: 4; }
.timer-ring {
  fill: none;
  stroke: var(--olive);
  stroke-width: 4;
  stroke-linecap: round;
  stroke-dasharray: 119.38;
  stroke-dashoffset: 0;
  transition: stroke 0.3s ease;
}
.timer-value {
  position: absolute;
  inset: 0;
  display: grid;
  place-items: center;
  font-weight: 700;
  font-size: 1.25rem;
  font-variant-numeric: tabular-nums;
}
.timer.is-low .timer-ring { stroke: var(--clay); }
.timer.is-low .timer-value { color: var(--clay-ink); }
.timer.is-paused .timer-value { font-size: 0.75rem; letter-spacing: 0.04em; text-transform: uppercase; }
.timer.is-off { display: none; }

.q-prompt {
  font-family: var(--font-display);
  font-weight: 650;
  font-size: clamp(1.55rem, 3.6vw, 2.5rem);
  line-height: 1.18;
  margin: 0 0 6px;
  text-wrap: balance;
}
.q-prompt:focus { outline: none; }
.q-hint { color: var(--ink-soft); margin: 0 0 18px; font-size: 0.95rem; min-height: 1.4em; }

.choices { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

.choice {
  display: flex;
  align-items: center;
  gap: 14px;
  width: 100%;
  min-height: 76px;
  padding: 14px 18px 14px 14px;
  text-align: left;
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  cursor: pointer;
  font-size: 1.08rem;
  font-weight: 500;
  line-height: 1.35;
  transition: transform 0.12s ease, border-color 0.15s ease, background-color 0.2s ease, opacity 0.2s ease;
}
.choice:hover:not(:disabled) { border-color: var(--gold); transform: translateY(-1px); }
.choice:active:not(:disabled) { transform: scale(0.99); }
.choice:disabled { cursor: default; }
.choice-letter {
  flex: none;
  width: 40px; height: 40px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  background: var(--surface-2);
  border: 1px solid var(--line);
  color: var(--gold-ink);
  font-weight: 700;
  font-size: 1.05rem;
}
.choice-text { flex: 1; }
.choice-mark { flex: none; width: 26px; height: 26px; display: none; }

.choice.is-selected { border-color: var(--gold); background: var(--surface-2); box-shadow: 0 0 0 3px color-mix(in srgb, var(--gold) 30%, transparent); }
.choice.is-selected .choice-letter { background: var(--gold); color: var(--primary-ink); border-color: var(--gold); }

.choice.is-correct { border-color: var(--olive); background: var(--olive-bg); color: var(--olive-ink); animation: pop 0.35s ease; }
.choice.is-correct .choice-letter { background: var(--olive); border-color: var(--olive); color: #fff; }
.choice.is-correct .choice-mark.mark-check { display: block; color: var(--olive); }

.choice.is-wrong { border-color: var(--clay); background: var(--clay-bg); color: var(--clay-ink); animation: shake 0.35s ease; }
.choice.is-wrong .choice-letter { background: var(--clay); border-color: var(--clay); color: #fff; }
.choice.is-wrong .choice-mark.mark-x { display: block; color: var(--clay); }

.choice.is-dim { opacity: 0.5; }

@keyframes pop { 40% { transform: scale(1.02); } }
@keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

.facilitator-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 12px;
  margin-top: 18px;
}
.kbd-hint { margin: 0 0 0 auto; font-size: 0.8rem; color: var(--ink-soft); }
kbd {
  font-family: var(--font-body);
  font-size: 0.78rem;
  padding: 1px 6px;
  border: 1px solid var(--line);
  border-bottom-width: 2px;
  border-radius: 6px;
  background: var(--surface);
}

.feedback { margin-top: 18px; padding: 20px 22px; animation: rise 0.3s ease both; }
.feedback-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.verdict {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 14px;
  border-radius: 999px;
  font-weight: 700;
  font-size: 0.95rem;
}
.verdict svg { width: 18px; height: 18px; }
.verdict.ok { background: var(--olive-bg); color: var(--olive-ink); }
.verdict.no { background: var(--clay-bg); color: var(--clay-ink); }
.verdict.neutral { background: var(--surface-2); color: var(--gold-ink); }
.points { font-weight: 700; font-size: 1.15rem; color: var(--olive); font-variant-numeric: tabular-nums; }
.feedback-text { margin: 0 0 10px; font-size: 1.05rem; }
.feedback-ref {
  display: flex;
  align-items: center;
  gap: 8px;
  margin: 0 0 16px;
  font-weight: 600;
  color: var(--gold-ink);
}
.feedback-ref svg { width: 20px; height: 20px; flex: none; }
.btn-next { width: 100%; }

.team-award { margin: 0 0 16px; padding-top: 14px; border-top: 1px solid var(--line); }
.team-award-label { margin: 0 0 10px; font-weight: 600; }
.team-chips { display: flex; flex-wrap: wrap; gap: 8px; }
.team-chip {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  min-height: 46px;
  padding: 8px 16px;
  border-radius: 999px;
  border: 1.5px solid var(--line);
  background: var(--bg-glow);
  cursor: pointer;
  font-weight: 600;
}
.team-chip svg { width: 18px; height: 18px; display: none; }
.team-chip[aria-pressed='true'] { background: var(--olive-bg); border-color: var(--olive); color: var(--olive-ink); }
.team-chip[aria-pressed='true'] svg { display: block; }

.team-strip {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: -6px 0 18px;
}
.team-score {
  display: inline-flex;
  align-items: baseline;
  gap: 8px;
  padding: 6px 14px;
  border-radius: 999px;
  background: var(--surface);
  border: 1px solid var(--line);
  font-size: 0.92rem;
}
.team-score strong { font-variant-numeric: tabular-nums; }
.team-score.bump { animation: pop 0.4s ease; border-color: var(--olive); }

/* ───────── Results ───────── */

.screen-results, .screen-host { max-width: 760px; margin: 0 auto; }
.achievement { text-align: center; margin-bottom: 16px; }
.medal { width: 96px; height: 96px; margin: 4px auto 12px; }
.medal svg { width: 100%; height: 100%; }
.medal-ring { fill: var(--gold-soft); stroke: var(--gold); stroke-width: 2.5; }
.medal-stalk { color: var(--gold-ink); }
.achievement .display { margin-bottom: 8px; }

.score-summary {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
  gap: 12px;
  margin: 0 0 24px;
}
.stat {
  min-width: 140px;
  padding: 14px 18px;
  text-align: center;
  background: var(--surface);
  border: 1px solid var(--line);
  border-radius: var(--radius);
}
.stat-value { display: block; font-family: var(--font-display); font-weight: 650; font-size: 2rem; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat-label { font-size: 0.85rem; color: var(--ink-soft); }

.leaderboard-card { padding: 18px 20px; }
.leaderboard-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
.leaderboard-head h3 { margin: 0; font-family: var(--font-display); font-weight: 650; font-size: 1.3rem; }
.leaderboard-head .muted { font-size: 0.85rem; }
.leaderboard { list-style: none; margin: 0; padding: 0; }
.leaderboard li {
  display: grid;
  grid-template-columns: 36px 1fr auto;
  align-items: center;
  gap: 10px;
  padding: 10px 6px;
  border-bottom: 1px solid var(--line);
}
.leaderboard li:last-child { border-bottom: 0; }
.leaderboard .rank {
  width: 32px; height: 32px;
  display: grid;
  place-items: center;
  border-radius: 50%;
  background: var(--surface-2);
  font-weight: 700;
  font-size: 0.9rem;
  color: var(--ink-soft);
}
.leaderboard li:nth-child(1) .rank { background: var(--gold); color: var(--primary-ink); }
.leaderboard .who { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
